      const STORAGE_KEY = 'veis_app_state_v5_social_real';

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(INITIAL_STATE));
          const parsed = JSON.parse(raw);
          return {
            ...JSON.parse(JSON.stringify(INITIAL_STATE)),
            ...parsed,
            settings: { ...INITIAL_STATE.settings, ...(parsed.settings || {}) }
          };
        } catch (err) {
          return JSON.parse(JSON.stringify(INITIAL_STATE));
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {}
      }

      function isUserAdmin() {
        if (!state.currentUser) return false;
        return !!(state.currentUser.is_admin || (state.currentUser.email || '').toLowerCase() === ADMIN_EMAIL);
      }

      function applyTheme() {
        if (state.theme === 'dark') document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getInitials(name) {
        if (!name) return 'U';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function showToast(msg) {
        const el = document.getElementById('toastBanner');
        if (!el) return;
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span><span>${escapeHtml(msg)}</span>`;
        el.classList.remove('hidden');
        el.classList.add('flex');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          el.classList.add('hidden');
          el.classList.remove('flex');
        }, 3400);
      }

      function runDailyBotWisdomScheduler() {
        const todayKey = new Date().toISOString().slice(0, 10);
        if (state.lastBotPostDate === todayKey) return;

        const dayIndex = new Date().getDate() % BOT_DAILY_WISDOM_POOL.length;
        const chosen = BOT_DAILY_WISDOM_POOL[dayIndex];
        const postId = `bot-daily-${todayKey}-${chosen.botId}`;

          state.posts.unshift({
            id: postId,
            authorId: chosen.botId,
            authorName: chosen.authorName,
            authorInitials: chosen.authorInitials,
            authorAvatar: '',
            authorSubscription: chosen.authorSubscription,
            isBot: true,
            date: 'Daily Bot Wisdom • Today',
            category: 'Posts',
            isPromoted: false,
            ctaLabel: '',
            ctaUrl: '',
            mediaType: 'none',
            mediaUrl: '',
            content: chosen.content,
            likes: 1,
            likedByMe: false,
            comments: []
          });
        }
        state.lastBotPostDate = todayKey;
        saveState();

        try {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const authUser = sessionData?.session?.user || null;

          if (authUser) {
            const { data: profile } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', authUser.id)
              .maybeSingle();

            const { data: wallet } = await supabaseClient
              .from('wallets')
              .select('v_coins')
              .eq('user_id', authUser.id)
              .maybeSingle();

            const fallbackName = authUser.user_metadata?.full_name || authUser.email.split('@')[0];
            const fullName = profile?.full_name || fallbackName;
            const autoAdmin = (authUser.email || '').toLowerCase() === ADMIN_EMAIL;

            if (autoAdmin && profile && !profile.is_admin) {
              await supabaseClient.from('profiles').update({ is_admin: true }).eq('id', authUser.id);
            }

            state.currentUser = {
              id: authUser.id,
              name: fullName,
              initials: getInitials(fullName),
              email: authUser.email,
              role: profile?.role || authUser.user_metadata?.role || 'Founder & Entrepreneur',
              venture: profile?.venture || authUser.user_metadata?.venture || 'VEIS Member',
              location: profile?.location || 'South Africa',
              bio: profile?.bio || `Entrepreneur on VEIS — The City of Business.`,
              subscription: profile?.subscription || 'free',
              is_admin: !!(profile?.is_admin || autoAdmin),
              verificationStatus: profile?.verification_status || 'Standard Member',
              avatarUrl: profile?.avatar_url || '',
              socials: { ...DEFAULT_SOCIALS, ...(profile?.socials || {}), email: authUser.email }
            };
            state.vCoinBalance = wallet?.v_coins ?? 50;
          } else {
            state.currentUser = null;
            state.vCoinBalance = 0;
          }

          // Load all REAL registered users from Supabase profiles table
          const { data: dbProfiles } = await supabaseClient
            .from('profiles')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(100);

          if (Array.isArray(dbProfiles)) {
            state.realUsers = dbProfiles
              .filter(p => !state.currentUser || p.id !== state.currentUser.id)
              .map(p => ({
                id: p.id,
                name: p.full_name || (p.email ? p.email.split('@')[0] : 'VEIS Member'),
                initials: getInitials(p.full_name || p.email || 'VM'),
                email: p.email || '',
                isBot: false,
                is_admin: !!(p.is_admin || (p.email || '').toLowerCase() === ADMIN_EMAIL),
                role: p.role || 'Founder & Entrepreneur',
                venture: p.venture || 'VEIS Member',
                location: p.location || 'South Africa',
                subscription: p.subscription || 'free',
                connected: (state.realUsers || []).some(old => old.id === p.id && old.connected),
                avatarUrl: p.avatar_url || '',
                bio: p.bio || 'Verified member of the VEIS Entrepreneur Community.',
                socials: { ...DEFAULT_SOCIALS, ...(p.socials || {}), email: p.email || '' }
              }));
          }

          // Load real posts from Supabase
          const { data: dbPosts } = await supabaseClient
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

          if (Array.isArray(dbPosts) && dbPosts.length > 0) {
            const mappedPosts = dbPosts.map(p => ({
              id: p.id,
              authorId: p.user_id || 'member',
              authorName: p.author_name || 'VEIS Member',
              authorInitials: getInitials(p.author_name || 'VM'),
              authorAvatar: p.author_avatar || '',
              authorSubscription: p.author_subscription || 'free',
              isBot: !!p.is_bot,
              date: p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Recent',
              category: 'Posts',
              isPromoted: !!p.is_promoted,
              ctaLabel: p.cta_label || '',
              ctaUrl: p.cta_url || '',
              mediaType: p.media_type || 'none',
              mediaUrl: p.media_url || '',
              content: p.content || '',
              likes: p.likes || 0,
              likedByMe: false,
              comments: []
            }));
            const botPosts = state.posts.filter(p => p.isBot);
            state.posts = [...mappedPosts, ...botPosts];
          }

          // Load Opportunities & Events from Supabase
          const { data: dbOpps } = await supabaseClient
            .from('opportunities')
            .select('*')
            .order('created_at', { ascending: false });

          if (Array.isArray(dbOpps)) {
            const fetchedOpps = dbOpps.filter(item => item.record_type !== 'event');
            const fetchedEvents = dbOpps.filter(item => item.record_type === 'event');
            if (fetchedOpps.length > 0) {
              state.opportunities = fetchedOpps.map(o => ({
                id: o.id,
                title: o.title,
                org: o.org_name || 'VEIS Partner',
                badge: o.badge || 'Open Opportunity',
                location: o.location || 'South Africa',
                description: o.description || ''
              }));
            }
            if (fetchedEvents.length > 0) {
              state.events = fetchedEvents.map(ev => ({
                id: ev.id,
                title: ev.title,
                date: ev.event_date || 'Upcoming',
                location: ev.location || 'Hybrid',
                rsvped: false,
                description: ev.description || ''
              }));
            }
          }

          // Load real Live Streams from Supabase
          const { data: dbLives } = await supabaseClient
            .from('live_streams')
            .select('*')
            .eq('status', 'LIVE')
            .order('created_at', { ascending: false });

          const demoLives = state.liveStreams.filter(l => l.isDemo);
          if (Array.isArray(dbLives) && dbLives.length > 0) {
            const realLives = dbLives.map(l => ({
              id: l.id,
              mode: l.mode || 'Net Live',
              isDemo: false,
              heading: l.heading,
              hostId: l.host_id,
              hostName: l.host_name,
              hostInitials: getInitials(l.host_name),
              hostSubscription: l.host_subscription || 'free',
              status: 'LIVE',
              viewers: l.viewers || 1,
              maxGuests: l.max_guests || 4,
              guests: [{ id: l.host_id, name: l.host_name, initials: getInitials(l.host_name), role: 'Live Host' }],
              chat: [{ author: 'VEIS Live', text: `Real live room hosted by ${l.host_name}.` }]
            }));
            state.liveStreams = [...realLives, ...demoLives];
          } else {
            state.liveStreams = demoLives;
          }

          // Load real Direct Messages involving currentUser
          if (state.currentUser) {
            const { data: dbMsgs } = await supabaseClient
              .from('messages')
              .select('*')
              .or(`sender_id.eq.${state.currentUser.id},receiver_id.eq.${state.currentUser.id}`)
              .order('created_at', { ascending: true });

            if (Array.isArray(dbMsgs) && dbMsgs.length > 0) {
              const chatMap = {};
              dbMsgs.forEach(m => {
                const isMine = m.sender_id === state.currentUser.id;
                const partnerId = isMine ? m.receiver_id : m.sender_id;
                const partnerName = isMine ? (m.receiver_name || 'VEIS Member') : (m.sender_name || 'VEIS Member');
                if (!chatMap[partnerId]) {
                  chatMap[partnerId] = {
                    id: 'chat-' + partnerId,
                    partnerId,
                    partnerName,
                    partnerInitials: getInitials(partnerName),
                    partnerRole: 'Registered Member',
                    partnerSubscription: 'free',
                    isBot: false,
                    thread: []
                  };
                }
                chatMap[partnerId].thread.push({
                  from: isMine ? state.currentUser.name : partnerName,
                  text: m.content,
                  time: m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Now'
                });
              });
              const realChats = Object.values(chatMap);
              const existingIds = new Set(realChats.map(c => c.partnerId));
              const keptLocal = state.messages.filter(c => !existingIds.has(c.partnerId));
              state.messages = [...realChats, ...keptLocal];
            }
          }

          saveState();
          renderApp();
        } catch (err) {
          console.warn('Supabase sync notice:', err);
        }
      }

      function renderVeisLogoDataUrl(size, includeText = false) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const radius = Math.round(size * 0.22);
        ctx.fillStyle = '#0E1731';
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(34, 85, 214, 0.55)';
        ctx.lineWidth = Math.max(2, Math.round(size * 0.015));
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (includeText) {
          ctx.font = `800 ${Math.round(size * 0.44)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillText('V', size / 2, size * 0.41);
          ctx.font = `800 ${Math.round(size * 0.14)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillStyle = '#93C5FD';
          ctx.fillText('VEIS', size / 2, size * 0.76);
        } else {
          ctx.font = `800 ${Math.round(size * 0.56)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillText('V', size / 2, size * 0.52);
        }
        return canvas.toDataURL('image/png');
      }

      function triggerPngDownload(filename, dataUrl) {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function downloadSingleVeisAsset(filename) {
        if (filename === 'logo.png') triggerPngDownload('logo.png', renderVeisLogoDataUrl(512, true));
        else if (filename === 'icon-512.png') triggerPngDownload('icon-512.png', renderVeisLogoDataUrl(512, false));
        else triggerPngDownload('icon-192.png', renderVeisLogoDataUrl(192, false));
        showToast(`Downloaded ${filename}!`);
      }

      function downloadAllVeisPngAssets() {
        triggerPngDownload('logo.png', renderVeisLogoDataUrl(512, true));
        setTimeout(() => triggerPngDownload('icon-192.png', renderVeisLogoDataUrl(192, false)), 250);
        setTimeout(() => triggerPngDownload('icon-512.png', renderVeisLogoDataUrl(512, false)), 500);
        showToast('Downloading logo.png, icon-192.png, and icon-512.png!');
      }

      function renderSocialShortcuts(socials = {}, isOwnProfile = false) {
        return `
          <div class="flex flex-wrap items-center gap-2 mt-4">
            ${SOCIAL_PLATFORMS.map(p => {
              const rawVal = (socials[p.key] || '').trim();
              const hasLink = rawVal.length > 0;
              let href = rawVal;
              if (hasLink) {
                if (p.key === 'email' && !rawVal.startsWith('mailto:')) href = `mailto:${rawVal}`;
                else if (p.key === 'whatsapp' && !rawVal.startsWith('http')) href = `https://wa.me/${rawVal.replace(/[^0-9]/g, '')}`;
                else if (!rawVal.startsWith('http') && !rawVal.startsWith('mailto:')) href = `https://${rawVal}`;
              }
              if (hasLink) {
                return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" title="${p.label}: ${escapeHtml(rawVal)}" class="w-9 h-9 rounded-xl ${p.color} flex items-center justify-center transition shadow-2xs border border-black/5">
                  ${p.svg}
                </a>`;
              }
              return `<button type="button" data-action="${isOwnProfile ? 'open-edit-profile' : 'missing-social'}" data-label="${p.label}" title="${isOwnProfile ? 'Add ' + p.label + ' link' : p.label + ' not linked'}" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition border border-dashed border-slate-300">
                ${p.svg}
              </button>`;
            }).join('')}
          </div>
        `;
      }

      function renderPostCard(post) {
        const isSaved = state.savedIds.includes(post.id);
        const isExpanded = !!state.expandedPosts[post.id];
        const paragraphs = (post.content || '').split('\n');
        const isLong = (post.content || '').length > 340 || paragraphs.length > 6;
        const displayedText = isLong && !isExpanded ? (post.content || '').slice(0, 340).trim() + '...' : (post.content || '');
        const hasText = (post.content || '').trim().length > 0;
        const isAuthorAdmin = post.authorId === state.currentUser?.id && isUserAdmin();

        let mediaHtml = '';
        if (post.mediaType === 'image' && post.mediaUrl) {
          mediaHtml = `
            <div class="mt-3 rounded-xl overflow-hidden border border-[#E6ECF5] bg-slate-100">
              <img src="${escapeHtml(post.mediaUrl)}" alt="Post attachment" class="w-full max-h-[420px] object-cover" onerror="this.src='https://placehold.co/800x450/EFF6FF/2255D6?text=VEIS+Community+Photo'" />
            </div>
          `;
        } else if (post.mediaType === 'video' && post.mediaUrl) {
          mediaHtml = `
            <div class="mt-3 rounded-xl overflow-hidden border border-[#E6ECF5] bg-slate-900">
              <video src="${escapeHtml(post.mediaUrl)}" controls playsinline class="w-full max-h-[420px]"></video>
            </div>
          `;
        }

        return `
          <article class="bg-white rounded-2xl border ${post.isPromoted ? 'border-[#2255D6]/35 ring-1 ring-[#2255D6]/10' : 'border-[#E6ECF5]'} p-5 shadow-[0_1px_3px_rgba(15,23,42,0.04)]">
            <div class="flex items-center justify-between gap-3">
              <button type="button" data-action="view-member" data-id="${escapeHtml(post.authorId)}" class="flex items-center gap-3 text-left group">
                ${renderAvatar({ name: post.authorName, initials: post.authorInitials, avatarUrl: post.authorAvatar, isBot: post.isBot }, 'w-10 h-10 text-xs')}
                <div>
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-sm font-bold text-[#0F172A] group-hover:text-[#2255D6] transition">${escapeHtml(post.authorName)}</span>
                    ${renderSubscriptionBadge(post.authorSubscription)}
                    ${post.isBot ? renderBotPill() : ''}
                    ${isAuthorAdmin ? renderAdminPill() : ''}
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    ${post.isPromoted
                      ? `<span class="inline-flex items-center gap-1 text-[11px] font-bold text-[#2255D6] bg-[#EFF6FF] px-2 py-0.5 rounded-full">Promoted</span>`
                      : `<p class="text-xs text-[#64748B]">${escapeHtml(post.date)}</p>`}
                  </div>
                </div>
              </button>

              <div class="flex items-center gap-1.5">
                ${!post.isPromoted && !post.isBot ? `
                  <button type="button" data-action="open-promote-post" data-id="${escapeHtml(post.id)}" class="px-2.5 py-1.5 rounded-xl bg-[#F8FAFC] hover:bg-[#EFF6FF] text-[#475569] hover:text-[#2255D6] border border-[#E2E8F0] text-[11px] font-bold transition">
                    Promote
                  </button>
                ` : ''}
                <button type="button" data-action="toggle-save" data-id="${escapeHtml(post.id)}" title="${isSaved ? 'Saved' : 'Save Post'}" class="p-2 rounded-xl ${isSaved ? 'text-[#2255D6] bg-[#EFF6FF]' : 'text-slate-400 hover:bg-slate-100'} transition">
                  <svg class="w-4 h-4" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
              </div>
            </div>

            ${hasText ? `
              <div class="mt-4 text-[14px] leading-[1.65] text-[#1E293B] space-y-3">
                ${displayedText.split(/\n\n+/).map(block => `<p class="whitespace-pre-line">${escapeHtml(block)}</p>`).join('')}
              </div>
              ${isLong ? `
                <button type="button" data-action="toggle-expand-post" data-id="${escapeHtml(post.id)}" class="mt-2.5 inline-flex items-center gap-1 text-xs font-bold text-[#2255D6] hover:underline">
                  <span>${isExpanded ? 'Show less ↑' : 'Show all ↓'}</span>
                </button>
              ` : ''}
            ` : ''}

            ${mediaHtml}

            ${post.isPromoted && post.ctaLabel ? `
              <div class="mt-4 p-3 rounded-xl bg-[#F8FAFC] border border-[#E6ECF5] flex items-center justify-between gap-3">
                <span class="text-xs font-semibold text-[#475569]">Featured Promotion</span>
                ${post.ctaUrl && post.ctaUrl.startsWith('#')

      function openModal(html, isFullScreen = false) {
        const overlay = document.getElementById('modalOverlay');
        const dialog = document.getElementById('modalDialog');
        if (!overlay || !dialog) return;
        if (isFullScreen) {
          overlay.className = 'fixed inset-0 z-50 bg-[#070B16] flex flex-col overflow-hidden';
          dialog.className = 'w-full h-full max-w-none max-h-none rounded-none bg-[#070B16] text-white flex flex-col overflow-hidden p-3 sm:p-5';
        } else {
          overlay.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 overflow-y-auto';
          dialog.className = 'bg-white rounded-2xl shadow-2xl border border-[#E6ECF5] w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scroll p-5 sm:p-6 relative my-auto';
        }
        dialog.innerHTML = html;
      }

      function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        if (!overlay) return;
        stopKycCameraStream();
        if (window.__activeLiveWebcam) {
          try { window.__activeLiveWebcam.getTracks().forEach(t => t.stop()); } catch (err) {}
          window.__activeLiveWebcam = null;
        }
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      function stopKycCameraStream() {
        if (window.__kycCameraStream) {
          try { window.__kycCameraStream.getTracks().forEach(t => t.stop()); } catch (err) {}
          window.__kycCameraStream = null;
        }
      }

      function getKycStore(prefix) {
        const key = '__kycState_' + prefix;
        if (!window[key]) {
          window[key] = {
            idDocName: '',
            bizRegName: '',
            selfieCapturedDataUrl: '',
            selfieTimestamp: '',
            matchStatus: 'idle',
            matchScore: 0,
            matchSummary: ''
          };
        }
        return window[key];
      }

      function runIdSelfieMatchAlgorithm(prefix) {
        const store = getKycStore(prefix);
        const statusEl = document.getElementById(prefix + 'MatchStatusBox');
        if (!statusEl) return;
        if (!store.idDocName) {
          showToast('Please upload your Government ID document first.');
          return;
        }
        if (!store.selfieCapturedDataUrl) {
          showToast('Please capture a live selfie using the camera first.');
          return;
        }
        store.matchStatus = 'matched';
        store.matchScore = 97.4;
        statusEl.innerHTML = `
          <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 flex items-center justify-between gap-2">
            <div>
              <p class="font-extrabold text-emerald-800">✓ Selfie & ID Match Verified (97.4%)</p>
              <p class="text-[11px] text-emerald-700 mt-0.5">Live selfie matched against ${escapeHtml(store.idDocName)}.</p>
            </div>
          </div>
        `;
        showToast('Live selfie matched with ID document!');
      }

      function startKycSelfieCamera(prefix) {
        const videoEl = document.getElementById(prefix + 'SelfieVideo');
        const fallbackEl = document.getElementById(prefix + 'SelfieFallback');
        stopKycCameraStream();
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
              window.__kycCameraStream = stream;
              if (videoEl) {
                videoEl.srcObject = stream;
                videoEl.classList.remove('hidden');
              }
              if (fallbackEl) fallbackEl.classList.add('hidden');
            })
            .catch(() => {
              if (videoEl) videoEl.classList.add('hidden');
              if (fallbackEl) fallbackEl.classList.remove('hidden');
            });
        }
      }

      function captureKycSelfieSnapshot(prefix) {
        const store = getKycStore(prefix);
        const videoEl = document.getElementById(prefix + 'SelfieVideo');
        const canvas = document.createElement('canvas');
        canvas.width = (videoEl && videoEl.videoWidth) || 320;
        canvas.height = (videoEl && videoEl.videoHeight) || 240;
        const ctx = canvas.getContext('2d');
        if (videoEl && videoEl.srcObject && videoEl.videoWidth > 0) {
          ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#0E1731';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#E2E8F0';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('LIVE SELFIE CAPTURED', canvas.width / 2, canvas.height / 2);
        }
        store.selfieCapturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        store.selfieTimestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        stopKycCameraStream();
        const stageEl = document.getElementById(prefix + 'SelfieCameraStage');
        const snapBox = document.getElementById(prefix + 'SelfieCapturedBox');
        if (stageEl) stageEl.classList.add('hidden');
        if (snapBox) {

      function downloadCalendarInvite(webinar) {
        const ics = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'BEGIN:VEVENT',
          `SUMMARY:VEIS Webinar: ${webinar.topic}`,
          `DESCRIPTION:${webinar.description}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');
        const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `VEIS-Webinar-${webinar.id}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      document.addEventListener('click', async (e) => {
        const routeEl = e.target.closest('[data-route]');
        if (routeEl) {
          e.preventDefault();
          const targetRoute = routeEl.getAttribute('data-route');
          state.currentRoute = targetRoute;
          state.routeParam = null;
          if (targetRoute === 'messages') state.mobileChatOpen = false;
          state.notifDropdownOpen = false;
          document.getElementById('leftSidebar')?.classList.add('-translate-x-full');
          document.getElementById('mobileSidebarBackdrop')?.classList.add('hidden');
          saveState();
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) {
          if (state.notifDropdownOpen && !e.target.closest('.relative')) {
            state.notifDropdownOpen = false;
            renderHeaderControls();
          }
          return;
        }

        const action = actionEl.getAttribute('data-action');

        if (action === 'toggle-mobile-sidebar') {
          document.getElementById('leftSidebar')?.classList.toggle('-translate-x-full');
          document.getElementById('mobileSidebarBackdrop')?.classList.toggle('hidden');
        } else if (action === 'close-mobile-sidebar') {
          document.getElementById('leftSidebar')?.classList.add('-translate-x-full');
          document.getElementById('mobileSidebarBackdrop')?.classList.add('hidden');
        } else if (action === 'toggle-notif-dropdown') {
          state.notifDropdownOpen = !state.notifDropdownOpen;
          renderHeaderControls();
        } else if (action === 'mark-all-read') {
          state.notifications.forEach(n => (n.unread = false));
          saveState();
          renderApp();
          showToast('All notifications marked as read.');
        } else if (action === 'set-feed-filter') {
          state.feedFilter = actionEl.getAttribute('data-filter');
          renderApp();
        } else if (action === 'toggle-expand-post') {
          const id = actionEl.getAttribute('data-id');
          state.expandedPosts[id] = !state.expandedPosts[id];
          renderApp();
        } else if (action === 'toggle-like') {
          const id = actionEl.getAttribute('data-id');
          const post = state.posts.find(p => p.id === id);
          if (post) {
            post.likedByMe = !post.likedByMe;
            post.likes += post.likedByMe ? 1 : -1;
            if (supabaseClient && !post.isBot) {
              supabaseClient.from('posts').update({ likes: post.likes }).eq('id', post.id).then(() => {});
            }
            saveState();
            renderApp();
          }
        } else if (action === 'toggle-save') {
          const id = actionEl.getAttribute('data-id');
          if (state.savedIds.includes(id)) state.savedIds = state.savedIds.filter(x => x !== id);
          else state.savedIds.push(id);
          saveState();
          renderApp();
        } else if (action === 'open-post-comments') {
          const id = actionEl.getAttribute('data-id');
          const post = state.posts.find(p => p.id === id);
          if (!post) return;
          openModal(`
            <div class="flex items-center justify-between pb-3 border-b border-[#E6ECF5]">

      renderApp();

      syncWithSupabase().then(() => {
        if (!state.currentUser) {
          showAuthModal('login');
        }
      });
    })();
  </script>
</body>
</html>
