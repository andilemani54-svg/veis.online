<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0E1731" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VEIS" />
  <meta name="description" content="VEIS — The City of Business. Verified Economic Identity System." />
  <title>VEIS — The City of Business</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- LiveKit browser SDK. The API secret must remain on the token server, never in this file. -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }

    /* Responsive Desktop Multi-Column Architecture */
    .veis-shell {
      display: flex;
      width: 100%;
      min-height: calc(100vh - 4rem);
    }
    .veis-sidebar {
      width: 16rem;
      min-width: 16rem;
      flex-shrink: 0;
      background-color: #0E1731;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .veis-main {
      flex: 1 1 0%;
      min-width: 0;
      width: 100%;
    }
    .veis-container {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .veis-mobile-only {
        display: none !important;
      }
      .veis-sidebar {
        position: sticky !important;
        top: 4rem !important;
        height: calc(100vh - 4rem) !important;
        transform: translateX(0) !important;
      }
      .veis-home-layout {
        display: flex !important;
        flex-direction: row !important;
        align-items: flex-start !important;
        gap: 1.5rem !important;
        width: 100% !important;
      }
      .veis-feed-col {
        flex: 1 1 0% !important;
        min-width: 0 !important;
      }
      .veis-quick-access-desktop {
        display: block !important;
        width: 17.5rem !important;
        min-width: 17.5rem !important;
        flex-shrink: 0 !important;
      }
      .veis-desktop-grid-2 {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 1rem !important;
      }
      .veis-desktop-grid-3 {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 1rem !important;
      }
      .veis-messages-grid {
        display: grid !important;
        grid-template-columns: 350px minmax(0, 1fr) !important;
      }
    }

    @media (min-width: 1100px) {
      .veis-quick-access-desktop {
        width: 20rem !important;
        min-width: 20rem !important;
      }
      .veis-messages-grid {
        grid-template-columns: 390px minmax(0, 1fr) !important;
      }
    }


    /*
     * Desktop Home: keep the feed and Quick Access as two explicit,
     * independent columns. This is intentionally desktop-only.
     */
    @media (min-width: 1024px) {
      .veis-feed-col > section[aria-label="Quick Access"],
      .veis-feed-col .veis-mobile-only {
        display: none !important;
      }
      .veis-shell {
        display: flex !important;
        flex-direction: row !important;
        align-items: stretch !important;
        width: 100% !important;
      }

      #leftSidebar.veis-sidebar {
        flex: 0 0 16rem !important;
        width: 16rem !important;
        min-width: 16rem !important;
        max-width: 16rem !important;
        position: sticky !important;
        top: 4rem !important;
        height: calc(100vh - 4rem) !important;
        align-self: flex-start !important;
        transform: none !important;
      }

      #mainWorkspace.veis-main {
        flex: 1 1 0% !important;
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
      }

      #appWorkspaceContainer.veis-container {
        width: 100% !important;
        max-width: 1440px !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }

      #appViewContainer {
        display: block !important;
        width: 100% !important;
        min-width: 0 !important;
      }

      .veis-home-layout {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) minmax(16rem, 18rem) !important;
        grid-template-areas: "feed quick" !important;
        align-items: start !important;
        column-gap: 1.5rem !important;
        row-gap: 1.5rem !important;
        width: 100% !important;
        min-width: 0 !important;
      }

      .veis-feed-col {
        grid-area: feed !important;
        display: block !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        flex: none !important;
      }

      .veis-feed-col > section,
      .veis-feed-col .veis-post-card {
        display: block !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
      }

      .veis-feed-col .veis-post-card {
        position: relative !important;
        box-sizing: border-box !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }

      .veis-quick-access-desktop {
        grid-area: quick !important;
        display: block !important;
        position: sticky !important;
        top: 5.5rem !important;
        align-self: start !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        flex: none !important;
      }

      .veis-quick-access-desktop > div,
      .veis-quick-access-desktop button {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .veis-quick-access-desktop button {
        min-height: 7rem !important;
        padding: 1rem !important;
        background: #FFFFFF !important;
        border: 1px solid #E6ECF5 !important;
        border-radius: 1rem !important;
        text-align: left !important;
      }

      .veis-mobile-only {
        display: none !important;
      }
    }

    @media (min-width: 1280px) {
      .veis-home-layout {
        grid-template-columns: minmax(0, 1fr) minmax(18rem, 20rem) !important;
        column-gap: 1.75rem !important;
      }
    }


    /* Complete post cards on both phone and desktop layouts. */
    .veis-post-card {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto !important;
      min-height: 0;
      overflow: visible !important;
      box-sizing: border-box;
    }
    .veis-post-header,
    .veis-post-header > div,
    .veis-post-content,
    .veis-post-actions {
      min-width: 0;
      max-width: 100%;
    }
    .veis-post-content p {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .veis-post-media {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .veis-post-media img,
    .veis-post-media video {
      max-width: 100%;
      height: auto;
    }
    .veis-post-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    }
    .veis-post-actions button {
      min-width: 0 !important;
      white-space: normal !important;
      overflow-wrap: anywhere;
    }
    @media (max-width: 420px) {
      .veis-post-card { padding: 1rem !important; }
      .veis-post-actions { column-gap: 0.125rem !important; }
      .veis-post-actions button { gap: 0.25rem !important; font-size: 0.7rem !important; }
      .veis-post-actions svg { width: 0.95rem !important; height: 0.95rem !important; }
    }

    /* Dark Mode Overrides */
    body.dark-mode {
      background-color: #0B1120 !important;
      color: #F1F5F9 !important;
    }
    body.dark-mode .veis-brand-mark {
      background: linear-gradient(145deg, #101A35 0%, #1E3A8A 52%, #38BDF8 100%) !important;
      color: #F8FBFF !important;
      border: 1px solid rgba(147, 197, 253, 0.85) !important;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.18), 0 0 14px rgba(56, 189, 248, 0.58), inset 0 1px 5px rgba(255,255,255,0.42) !important;
      text-shadow: 0 0 8px rgba(255,255,255,0.85), 0 1px 2px rgba(15,23,42,0.8) !important;
    }
    body.dark-mode .veis-brand-word {
      color: #EAF4FF !important;
      letter-spacing: 0.045em !important;
      text-shadow: 0 0 5px rgba(147,197,253,0.85), 0 0 13px rgba(56,189,248,0.5), 0 1px 1px rgba(0,0,0,0.8) !important;
      filter: drop-shadow(0 0 5px rgba(59,130,246,0.35));
    }
    body.dark-mode header,
    body.dark-mode .bg-white {
      background-color: #111827 !important;
      color: #F1F5F9 !important;
    }
    body.dark-mode .bg-\[\#F7F9FC\],
    body.dark-mode .bg-\[\#F8FAFC\] {
      background-color: #0B1120 !important;
    }
    body.dark-mode .bg-\[\#F1F5F9\],
    body.dark-mode .bg-\[\#F3F5F8\] {
      background-color: #1E293B !important;
    }
    body.dark-mode .border-\[\#E6ECF5\],
    body.dark-mode .border-\[\#E2E8F0\],
    body.dark-mode .border-slate-200 {
      border-color: #1F2937 !important;
    }
    body.dark-mode .text-\[\#0F172A\],
    body.dark-mode .text-slate-900 {
      color: #F8FAFC !important;
    }
    body.dark-mode .text-\[\#1E293B\],
    body.dark-mode .text-\[\#334155\],
    body.dark-mode .text-slate-700 {
      color: #E2E8F0 !important;
    }
    body.dark-mode .text-\[\#64748B\],
    body.dark-mode .text-\[\#475569\],
    body.dark-mode .text-slate-500 {
      color: #94A3B8 !important;
    }
    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode select {
      background-color: #1E293B !important;
      color: #F8FAFC !important;
      border-color: #334155 !important;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.9; }
      70% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .live-pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      border: 2px solid #EF4444;
      animation: pulseRing 1.6s infinite;
    }
  </style>

  <script>
    (function () {
      const SUPABASE_URL = 'https://aqssnjtqbiimkqphmrge.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxc3NuanRxYmlpbWtxcGhtcmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MDQ1OTIsImV4cCI6MjExMDk4MDU5Mn0.m7K-O_IdVGhm-VH3LmtPAAHZYZVo0kghrXbP0RFBp-U';
      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) {
        supabaseClient = null;
      }

      // LiveKit production configuration: set these public values at deployment time.
      // TOKEN_ENDPOINT must be a trusted HTTPS server that authenticates the VEIS user,
      // authorizes the room/role, and returns a short-lived LiveKit access token.
      // Never place LIVEKIT_API_SECRET in browser HTML or JavaScript.
      window.VEIS_LIVEKIT_CONFIG = window.VEIS_LIVEKIT_CONFIG || {
        serverUrl: '',       // e.g. wss://your-project.livekit.cloud
        tokenEndpoint: ''    // e.g. https://api.veis.co.za/livekit/token
      };
      let veisLiveKitRoom = null;
      let veisLiveKitRoomKey = '';
      let veisScreenShareActive = false;

      async function toggleVEISScreenShare() {
        if (!veisLiveKitRoom || !veisLiveKitRoom.localParticipant) {
          showToast('Connect to the live room first, then share your screen.');
          return;
        }
        const active = state.activeBroadcast;
        if (!active) return;
        const source = active.type === 'webinar'
          ? (state.webinars || []).find(x => x.id === active.id)
          : (state.liveStreams || []).find(x => x.id === active.id);
        const canPresent = active.type === 'webinar'
          ? !!source && source.hostId === state.currentUser?.id
          : !!source && (source.hostId === state.currentUser?.id || (source.guests || []).some(g => g.id === state.currentUser?.id));
        if (!canPresent) {
          showToast('Only the host and approved stage speakers can share their screen.');
          return;
        }
        const local = veisLiveKitRoom.localParticipant;
        try {
          if (veisScreenShareActive) {
            await local.setScreenShareEnabled(false);
            veisScreenShareActive = false;
            const tile = document.getElementById('veisLocalScreenShareTile');
            if (tile) tile.remove();
            updateScreenShareButtons();
            showToast('Screen sharing stopped.');
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            showToast('Screen sharing is not supported by this browser. Try a recent desktop browser or supported mobile browser.');
            return;
          }
          await local.setScreenShareEnabled(true);
          veisScreenShareActive = true;
          const pubs = Array.from(local.videoTrackPublications.values());
          const screenPub = pubs.find(pub => pub.source === window.LivekitClient.Track.Source.ScreenShare || pub.track?.source === window.LivekitClient.Track.Source.ScreenShare);
          const mount = document.getElementById('veisLiveKitMediaGrid');
          if (screenPub?.track && mount) {
            const tile = document.createElement('div');
            tile.id = 'veisLocalScreenShareTile';
            tile.className = 'min-w-0 min-h-0 relative rounded-xl overflow-hidden bg-slate-900 border border-emerald-400/50 col-span-2';
            const video = screenPub.track.attach();
            video.className = 'w-full h-full max-h-64 object-contain rounded-xl bg-black';
            video.setAttribute('playsinline', '');
            tile.appendChild(video);
            const label = document.createElement('span');
            label.className = 'absolute bottom-2 left-2 px-2 py-1 rounded-lg bg-emerald-600/90 text-white text-[10px] font-bold';
            label.textContent = 'YOUR SCREEN';
            tile.appendChild(label);
            mount.prepend(tile);
          }
          updateScreenShareButtons();
          showToast('You are sharing your screen with the live room.');
        } catch (err) {
          veisScreenShareActive = false;

      async function connectVEISLiveKit() {
        const active = state.activeBroadcast;
        if (!active) return;
        const cfg = window.VEIS_LIVEKIT_CONFIG || {};
        if (!cfg.serverUrl || !cfg.tokenEndpoint) {
          showToast('LiveKit is approved but not configured yet. Add the LiveKit server URL and secure token endpoint to deployment settings.');
          return;
        }
        if (!window.LivekitClient || !window.LivekitClient.Room) {
          showToast('LiveKit video service could not load. Check the internet connection and refresh.');
          return;
        }
        if (!state.currentUser) {
          showAuthModal('login');
          return;
        }
        const source = active.type === 'webinar'
          ? (state.webinars || []).find(x => x.id === active.id)
          : (state.liveStreams || []).find(x => x.id === active.id);
        if (!source) return;
        const roomName = String(source.livekitRoom || `veis-${active.type}-${active.id}`).replace(/[^a-zA-Z0-9_-]/g, '-');
        const role = active.type === 'webinar' ? (source.hostId === state.currentUser.id ? 'presenter' : 'attendee')
          : (source.hostId === state.currentUser.id || (source.guests || []).some(g => g.id === state.currentUser.id) ? 'speaker' : 'audience');
        try {
          showToast('Connecting to the VEIS live room…');
          const tokenResponse = await fetch(cfg.tokenEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${supabaseClient?.auth ? (await supabaseClient.auth.getSession()).data?.session?.access_token || '' : ''}` },
            body: JSON.stringify({ roomName, identity: state.currentUser.id, participantName: state.currentUser.name, role, broadcastType: active.type })
          });
          if (!tokenResponse.ok) throw new Error(`Token service returned ${tokenResponse.status}`);
          const tokenData = await tokenResponse.json();
          const accessToken = tokenData.accessToken || tokenData.token;
          if (!accessToken) throw new Error('Secure token service did not return an access token.');
          if (veisLiveKitRoom) { try { await veisLiveKitRoom.disconnect(); } catch (_) {} }
          const room = new window.LivekitClient.Room({ adaptiveStream: true, dynacast: true });
          veisLiveKitRoom = room;
          veisLiveKitRoomKey = roomName;
          const mount = document.getElementById('veisLiveKitMediaGrid');
          const attachTrack = (track, participant) => {
            if (!mount || !track || !['video', 'audio'].includes(track.kind)) return;
            const el = track.attach();
            if (track.kind === 'video') {
              el.className = 'w-full h-full object-cover rounded-xl bg-slate-900';
              el.setAttribute('playsinline', '');
              let tile = mount.querySelector(`[data-participant="${CSS.escape(participant.identity)}"]`);
              if (!tile) {
                tile = document.createElement('div'); tile.className = 'min-w-0 min-h-0 relative rounded-xl overflow-hidden bg-slate-900 border border-white/15';
                tile.dataset.participant = participant.identity; mount.appendChild(tile);
              }
              tile.appendChild(el);
              const label = document.createElement('span'); label.className = 'absolute bottom-1 left-1 px-2 py-0.5 rounded bg-black/60 text-white text-[10px]'; label.textContent = participant.name || participant.identity; tile.appendChild(label);
            } else { el.autoplay = true; el.playsInline = true; el.style.display = 'none'; document.body.appendChild(el); }
          };
          room.on(window.LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => attachTrack(track, participant));
          room.on(window.LivekitClient.RoomEvent.TrackUnsubscribed, (track) => { try { track.detach().forEach(el => el.remove()); } catch (_) {} });
          room.on(window.LivekitClient.RoomEvent.Disconnected, () => { veisLiveKitRoom = null; veisLiveKitRoomKey = ''; });
          await room.connect(cfg.serverUrl, accessToken);
          if (mount) mount.innerHTML = '';
          for (const participant of room.remoteParticipants.values()) {
            for (const publication of participant.trackPublications.values()) if (publication.track) attachTrack(publication.track, participant);
          }
          if (role === 'speaker' || role === 'presenter') {
            await room.localParticipant.setCameraEnabled(true).catch(() => {});
            await room.localParticipant.setMicrophoneEnabled(true).catch(() => {});
          }
          showToast(`Connected to VEIS ${active.type === 'webinar' ? 'Webinar' : 'Live'} room.`);
        } catch (err) {
          console.error('VEIS LiveKit connection error:', err);
          showToast(`LiveKit connection failed: ${err.message || 'Check server configuration.'}`);
        }
      }

      ];

      function moderateVEISText(value) {
        const text = String(value || '').trim();
        for (const rule of VEIS_PROHIBITED_TEXT_PATTERNS) {
          if (rule.pattern.test(text)) return { allowed: false, category: rule.category };
        }
        return { allowed: true, category: null };
      }

      function showModerationNotice(result) {

      function observeVisiblePostCards() {
        const cards = document.querySelectorAll('[data-post-card-id]');
        if (!cards.length) return;
        if (!('IntersectionObserver' in window)) return;
        const observer = new IntersectionObserver(entries => {
          let changed = false;
          entries.forEach(entry => {
            if (!entry.isIntersecting || entry.intersectionRatio < 0.5) return;
            const postId = entry.target.getAttribute('data-post-card-id');
            const post = (state.posts || []).find(item => item.id === postId);
            if (post && recordQualifiedPostView(post)) {
              changed = true;
              document.querySelectorAll(`[data-post-view-count="${CSS.escape(postId)}"]`).forEach(el => {
                el.textContent = Number(post.views || 0).toLocaleString();
              });
            }
            observer.unobserve(entry.target);
          });
          if (changed) saveState();
        }, { threshold: 0.5 });
        cards.forEach(card => {
          const postId = card.getAttribute('data-post-card-id');
          if (!(state.viewedPostIdsInSession || []).includes(postId)) observer.observe(card);
        });
      }

        const todayYear = refDate.getFullYear();

          if (parts.length === 3) {
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            if (m === todayMonth && d === todayDay) {

      function queueConnectionAlert(kind, title, message, destination) {
        if (!state.currentUser) return 0;
        const recipients = (state.realUsers || []).filter(u => u.connected && u.id !== state.currentUser.id);
        const createdAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (!Array.isArray(state.connectionNotificationQueue)) state.connectionNotificationQueue = [];
        if (!Array.isArray(state.notifications)) state.notifications = [];
        recipients.forEach(person => {
          const id = `conn-${kind}-${Date.now()}-${person.id}`;
          const alert = {
            id, recipientId: person.id, senderId: state.currentUser.id,
            senderName: state.currentUser.name, type: 'activity', activityType: kind,
            title, text: `${state.currentUser.name}: ${message}`, url: destination,
            time: createdAt, unread: true
          };
          state.connectionNotificationQueue.unshift(alert);
          state.notifications.unshift(alert);
        });
        state.connectionNotificationQueue = state.connectionNotificationQueue.slice(0, 500);
        state.notifications = state.notifications.slice(0, 1000);
        return recipients.length;
      }

              name: fullName,
              initials: getInitials(fullName),
              email: authUser.email,
              role: profile?.role || authUser.user_metadata?.role || 'Founder & Entrepreneur',
              venture: profile?.venture || authUser.user_metadata?.venture || 'VEIS Member',
              location: profile?.location || 'South Africa',
              bio: profile?.bio || 'Entrepreneur on VEIS — The City of Business.',
              subscription: profile?.subscription || 'free',
              is_admin: !!(profile?.is_admin || autoAdmin),
              isApprovedMentor: !!(profile?.is_approved_mentor || state.currentUser?.isApprovedMentor || autoAdmin),
              mentorSpecialty: profile?.mentor_specialty || state.currentUser?.mentorSpecialty || '',
              verificationStatus: profile?.verification_status || 'Standard Member',
              avatarUrl: profile?.avatar_url || '',
              coverUrl: profile?.cover_url || state.currentUser?.coverUrl || '',
              birthday: profile?.birthday || state.currentUser?.birthday || '',
              businessAnniversary: profile?.business_anniversary || state.currentUser?.businessAnniversary || '',
              socials: { ...DEFAULT_SOCIALS, ...(profile?.socials || {}), email: authUser.email }
            };

            if (wallet) {
              const dbEarned = Number(wallet.total_earned || 0);
              const dbWithdrawn = Number(wallet.total_withdrawn || 0);
              const dbTotal = Number(wallet.balance ?? wallet.v_coins ?? 0);
              if (dbEarned > state.vCoinEarned) state.vCoinEarned = dbEarned;
              if (dbWithdrawn > state.vCoinWithdrawn) state.vCoinWithdrawn = dbWithdrawn;
              if (dbTotal > syncTotalVCoinBalance()) {
                state.vCoinPurchased = Math.max(0, Number((dbTotal - getWithdrawableVCoinBalance()).toFixed(2)));
              }
              syncTotalVCoinBalance();
            }
          }

          const { data: dbProfiles } = await supabaseClient
            .from('profiles')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(100);

          if (Array.isArray(dbProfiles)) {
            state.realUsers = dbProfiles
              .filter(p => !state.currentUser || p.id !== state.currentUser.id)
              .map(p => {
                const prev = (state.realUsers || []).find(old => old.id === p.id);
                const approvedFromApp = (state.mentorApplications || []).some(a => a.status === 'approved' && a.userId === p.id);
                return {
                  id: p.id,
                  name: p.full_name || (p.email ? p.email.split('@')[0] : 'VEIS Member'),
                  initials: getInitials(p.full_name || p.email || 'VM'),
                  email: p.email || '',
                  isBot: false,
                  is_admin: p.is_admin === true,
                  isApprovedMentor: !!(p.is_approved_mentor || prev?.isApprovedMentor || approvedFromApp || (p.email || '').toLowerCase() === ADMIN_EMAIL),
                  mentorSpecialty: p.mentor_specialty || prev?.mentorSpecialty || '',
                  role: p.role || 'Founder & Entrepreneur',
                  venture: p.venture || 'VEIS Member',
                  location: p.location || 'South Africa',
                  subscription: p.subscription || 'free',
                  connected: !!prev?.connected,
                  avatarUrl: p.avatar_url || '',
                  coverUrl: p.cover_url || prev?.coverUrl || '',
                  birthday: p.birthday || prev?.birthday || '',
                  businessAnniversary: p.business_anniversary || prev?.businessAnniversary || '',
                  bio: p.bio || 'Verified member of the VEIS Entrepreneur Community.',
                  socials: { ...DEFAULT_SOCIALS, ...(p.socials || {}), email: p.email || '' }
                };
              });
          }

          const { data: dbPosts } = await supabaseClient
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

          if (Array.isArray(dbPosts) && dbPosts.length > 0) {
            const mappedPosts = dbPosts.map(p => {
              const existing = state.posts.find(old => old.id === p.id);
              return {
                id: p.id,
                authorId: p.user_id || 'member',
                authorName: p.author_name || 'VEIS Member',
                authorInitials: getInitials(p.author_name || 'VM'),
                authorAvatar: p.author_avatar || '',
                authorSubscription: p.author_subscription || 'free',
                isBot: !!p.is_bot,
                date: p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Recent',
                category: 'Posts',
                isPromoted: !!p.is_promoted,
                isSponsored: !!p.is_promoted || !!existing?.isSponsored,
                isBoosted: !!existing?.isBoosted,
                ctaLabel: p.cta_label || '',
                ctaUrl: p.cta_url || '',
                mediaType: p.media_type || 'none',
                mediaUrl: p.media_url || '',
                content: p.content || '',
                likes: p.likes || 0,
                views: Math.max(Number(p.views_count || p.views || 0), Number(existing?.views || 0)),
                likedByMe: existing?.likedByMe || false,
                comments: existing?.comments || []
              };
            });
            const botPosts = state.posts.filter(p => p.isBot);
            state.posts = [...mappedPosts, ...botPosts];
          }

          syncCelebrationNotifications();
          saveState();
          renderApp();
        } catch (err) {}
      }

      function renderPostCard(post) {
        const isSaved = state.savedIds.includes(post.id);
        const hasText = (post.content || '').trim().length > 0;
        const isAuthorAdmin = post.authorId === state.currentUser?.id && isUserAdmin();
        const isPostAuthor = !!(state.currentUser && post.authorId === state.currentUser.id);
        const authorPerson = isPostAuthor
          ? state.currentUser
          : (state.realUsers || []).find(u => u.id === post.authorId);
        const isAuthorMentor = !post.isBot && (post.authorIsMentor || isPersonApprovedMentor(authorPerson));
        let mediaHtml = '';
        if (post.mediaType === 'image' && post.mediaUrl) {
          mediaHtml = `
            <div class="veis-post-media mt-3 rounded-xl border border-[#E6ECF5] bg-slate-100">
              <img src="${escapeHtml(post.mediaUrl)}" alt="Post attachment" class="block w-full max-h-[420px] object-contain" onerror="this.src='https://placehold.co/800x450/EFF6FF/2255D6?text=VEIS+Community+Photo'" />
            </div>
          `;
        } else if (post.mediaType === 'video' && post.mediaUrl) {
          mediaHtml = `
            <div class="veis-post-media mt-3 rounded-xl border border-[#E6ECF5] bg-slate-900">
              <video src="${escapeHtml(post.mediaUrl)}" controls playsinline class="block w-full max-h-[420px]"></video>
            </div>
          `;
        }

        return `
          <article data-post-card-id="${escapeHtml(post.id)}" class="veis-post-card w-full min-w-0 bg-white rounded-2xl border ${post.isPromoted ? 'border-[#2255D6]/35 ring-1 ring-[#2255D6]/10' : 'border-[#E6ECF5]'} p-4 sm:p-5 mb-5 shadow-[0_1px_3px_rgba(15,23,42,0.04)]">
            <div class="veis-post-header flex items-start justify-between gap-3">
              <div class="flex items-start gap-3 min-w-0 flex-1">
                ${renderAvatar({ name: post.authorName, initials: post.authorInitials, avatarUrl: post.authorAvatar, isBot: post.isBot }, 'w-10 h-10 text-xs shrink-0')}
                <div class="min-w-0 flex-1">
                  <button type="button" data-action="view-member" data-id="${escapeHtml(post.authorId)}" class="flex flex-wrap items-center gap-1.5 text-left group max-w-full">
                    <span class="text-sm font-bold text-[#0F172A] group-hover:text-[#2255D6] transition">${escapeHtml(post.authorName)}</span>
                    ${renderSubscriptionBadge(post.authorSubscription)}
                    ${isAuthorMentor ? renderMentorPill() : ''}
                    ${post.isBot ? renderBotPill() : ''}
                    ${isAuthorAdmin ? renderAdminPill() : ''}
                  </button>
                  <p class="text-xs text-[#64748B] mt-0.5">${escapeHtml(post.date || 'Today')}</p>
                  ${post.isSponsored ? `<span class="inline-flex mt-1.5 items-center gap-1 text-[10px] font-bold uppercase tracking-wide text-amber-800 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">Sponsored · Ad</span>` : ''}
                </div>
              </div>
              <div class="flex items-start gap-1 shrink-0">
                <button type="button" data-action="toggle-save" data-id="${escapeHtml(post.id)}" title="${isSaved ? 'Remove saved post' : 'Save post'}" aria-label="${isSaved ? 'Remove saved post' : 'Save post'}" aria-pressed="${isSaved ? 'true' : 'false'}" class="veis-post-bookmark inline-flex items-center justify-center w-9 h-9 rounded-xl ${isSaved ? 'bg-[#EFF6FF] text-[#2255D6]' : 'text-[#64748B] hover:bg-slate-100'} transition">
                  <svg class="w-5 h-5" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
                ${isPostAuthor ? `
                  <div class="veis-post-menu-wrap relative">
                    <button type="button" data-action="toggle-post-menu" data-id="${escapeHtml(post.id)}" aria-label="Post options" aria-expanded="false" class="inline-flex items-center justify-center w-9 h-9 rounded-xl text-[#64748B] hover:bg-slate-100 transition">
                      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
                    </button>
                    <div class="veis-post-menu hidden absolute right-0 top-10 z-30 w-48 rounded-xl border border-[#E2E8F0] bg-white p-1.5 shadow-xl">
                      <button type="button" data-action="edit-post" data-id="${escapeHtml(post.id)}" class="w-full rounded-lg px-3 py-2.5 text-left text-xs font-semibold text-[#334155] hover:bg-slate-100">Edit post</button>
                      <button type="button" data-action="boost-post" data-id="${escapeHtml(post.id)}" class="w-full rounded-lg px-3 py-2.5 text-left text-xs font-semibold text-[#2255D6] hover:bg-blue-50">${post.boostExpiresAt && post.boostExpiresAt > Date.now() ? 'Extend reach boost' : 'Boost post · Reach more viewers'}</button>

            </div>

            ${hasText ? `
              <div class="veis-post-content mt-4 text-[14px] leading-[1.65] text-[#1E293B] space-y-3">
                ${(post.content || '').split(/\n\n+/).map(block => `<p>${escapeHtml(block)}</p>`).join('')}
              </div>
            ` : ''}

            ${mediaHtml}

            ${post.isPromoted && post.ctaLabel ? `
              <div class="mt-4 p-3 rounded-xl bg-[#F8FAFC] border border-[#E6ECF5] flex flex-wrap items-center justify-between gap-3">
                <span class="text-xs font-semibold text-[#475569]">Featured Promotion</span>
                ${post.ctaUrl && post.ctaUrl.startsWith('#')

                  : `<a href="${escapeHtml(post.ctaUrl || '#')}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-[#2255D6] hover:bg-[#1B46B8] text-white text-xs font-bold transition shadow-2xs">${escapeHtml(post.ctaLabel)} →</a>`}
              </div>

      function renderSearchResultsView() {
        const q = state.searchQuery.trim().toLowerCase();
        const matchingPosts = state.posts.filter(p =>
          (p.content || '').toLowerCase().includes(q) || (p.authorName || '').toLowerCase().includes(q)
        );
        const allPeople = [...(state.realUsers || []), ...(state.bots || [])];
        const matchingMembers = allPeople.filter(m =>
          (m.name || '').toLowerCase().includes(q) || (m.role || '').toLowerCase().includes(q) || (m.venture || '').toLowerCase().includes(q)
        );

        return `
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold text-[#2255D6]">Global Search Results</p>

              <button type="button" data-action="clear-search" class="px-3.5 py-2 rounded-xl border border-[#E2E8F0] text-xs font-bold hover:bg-slate-100">Clear Search</button>
            </div>

            <div class="space-y-3">
              <h2 class="text-sm font-bold text-[#0F172A]">People & Bots (${matchingMembers.length})</h2>
              <div class="veis-desktop-grid-2 grid grid-cols-1 md:grid-cols-2 gap-3">
                ${matchingMembers.length ? matchingMembers.map(m => `
                  <div class="bg-white rounded-2xl border border-[#E6ECF5] p-4 flex items-center justify-between gap-3">
                    <button type="button" data-action="view-member" data-id="${escapeHtml(m.id)}" class="flex items-center gap-3 text-left">
                      ${renderAvatar(m, 'w-10 h-10 text-xs')}
                      <div>
                        <div class="flex items-center gap-1.5">
                          <p class="text-sm font-bold text-[#0F172A]">${escapeHtml(m.name)}</p>
                          ${renderSubscriptionBadge(m.subscription)}
                          ${isPersonApprovedMentor(m) ? renderMentorPill() : ''}
                          ${m.isBot ? renderBotPill() : ''}
                        </div>
                        <p class="text-xs text-[#64748B]">${escapeHtml(m.role)}</p>
                      </div>
                    </button>
                    <button type="button" data-action="toggle-connect" data-id="${escapeHtml(m.id)}" class="px-3 py-1.5 rounded-xl text-xs font-bold ${m.connected ? 'bg-emerald-50 text-emerald-700' : 'bg-[#2255D6] text-white'}">
                      ${m.connected ? 'Following' : 'Follow'}
                    </button>
                  </div>
                `).join('') : `<p class="text-xs text-[#64748B]">No matching profiles found.</p>`}
              </div>
            </div>

            <div class="space-y-3">
              <h2 class="text-sm font-bold text-[#0F172A]">Posts (${matchingPosts.length})</h2>
              ${matchingPosts.length ? matchingPosts.map(p => renderPostCard(p)).join('') : `<p class="text-xs text-[#64748B]">No matching posts found.</p>`}
            </div>
          </div>
        `;
      }

      function renderApp() {
        applyTheme();
        syncTotalVCoinBalance();
        renderSidebar();
        renderHeaderControls();
        renderFullScreenBroadcastOverlay();

        const mainEl = document.getElementById('mainWorkspace');
        const wrapEl = document.getElementById('appWorkspaceContainer');
        const isMessagesFullBleed = state.currentRoute === 'messages' && state.searchQuery.trim().length === 0;

        if (mainEl && wrapEl) {
          if (isMessagesFullBleed) {
            mainEl.className = 'veis-main flex-1 min-w-0 p-0 overflow-hidden';
            wrapEl.className = 'w-full h-full';
          } else {
            mainEl.className = 'veis-main flex-1 min-w-0 px-3 sm:px-6 lg:px-8 py-5 sm:py-6';
            wrapEl.className = 'veis-container max-w-[1440px] mx-auto';
          }
        }

        const container = document.getElementById('appViewContainer');
        if (!container) return;

        if (state.searchQuery.trim().length > 0) {
          container.innerHTML = renderSearchResultsView();
          observeVisiblePostCards();
          return;
        }

        const route = state.currentRoute;
        if (route === 'home') container.innerHTML = renderHomeView();
        else if (route === 'live') container.innerHTML = renderLiveDestinationView();
        else if (route === 'profile') container.innerHTML = renderProfileView(state.routeParam);
        else if (route === 'connect') container.innerHTML = renderConnectView();
        else if (route === 'settings') container.innerHTML = renderSettingsView();
        else container.innerHTML = renderSecondaryDestination(route);
        observeVisiblePostCards();
      }

      function openModal(htmlContent) {
        const overlay = document.getElementById('modalOverlay');
        const dialog = document.getElementById('modalDialog');
        if (!overlay || !dialog) return;
        dialog.innerHTML = htmlContent;
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        if (!overlay) return;
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      function showBusinessPlanDetails(planId) {
        const plan = (state.businessPlans || []).find(p => p.id === planId);

        const isDocument = plan.planType === 'document';

        const vimeoMatch = safeVideoUrl.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
        const videoEmbed = youtubeMatch
          ? `https://www.youtube-nocookie.com/embed/${youtubeMatch[1]}`

        openModal(`
          <div>

              <div>

      function requestNetLiveStage(stream, preferredSeat = null) {
        if (!stream || !state.currentUser || stream.mode !== 'Net Live') return;
        stream.pendingStageRequests = Array.isArray(stream.pendingStageRequests) ? stream.pendingStageRequests : [];
        if (stream.guests.some(g => g.id === state.currentUser.id)) {
          showToast('You are already on the stage.');
          return;
        }
        if (stream.pendingStageRequests.some(r => r.userId === state.currentUser.id)) {
          showToast('Your request is already waiting for the host.');
          return;
        }
        if (stream.guests.length >= 9) {
          showToast('All 9 stage seats are currently occupied.');
          return;
        }
        stream.pendingStageRequests.push({
          userId: state.currentUser.id,
          name: state.currentUser.name,
          initials: state.currentUser.initials || (state.currentUser.name || 'V').slice(0, 2).toUpperCase(),
          requestedAt: new Date().toISOString(),
          preferredSeat: Number.isInteger(preferredSeat) ? preferredSeat : null
        });
        stream.chat = Array.isArray(stream.chat) ? stream.chat : [];
        stream.chat.push({ author: 'VEIS System', badge: 'Stage Request', text: `${state.currentUser.name} requested to join the stage. The host will review the request.` });
        saveState();
        showToast('Stage request sent to the host.');
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      }

      function triggerCalendarDownload(webinar) {
        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//VEIS//The City of Business//EN',
          'BEGIN:VEVENT',
          `UID:${webinar.id}@veis.community`,
          `DTSTAMP:${webinar.isoStart}`,
          `DTSTART:${webinar.isoStart}`,
          `DTEND:${webinar.isoEnd}`,
          `SUMMARY:VEIS Webinar: ${webinar.topic}`,
          `DESCRIPTION:${webinar.description} (Hosted by ${webinar.hostName})`,
          'LOCATION:VEIS Live Studio',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `VEIS-Webinar-${webinar.id}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

            id: 'live-' + Date.now(),
            mode,
            isDemo: false,
            heading,
            hostId: state.currentUser.id,
            hostName: state.currentUser.name,
            hostInitials: state.currentUser.initials,
            hostSubscription: state.currentUser.subscription || 'free',
            status: 'LIVE',
            viewers: 1,
            likesCount: 1,
            dailyRank: 'New Live',
            galleryProgress: '1/15',
            maxGuests: mode === 'Live' ? 1 : maxGuests,
            invitedUsers: mode === 'Net Live' ? invitedUsers : [],
            guests: [
              { id: state.currentUser.id, name: state.currentUser.name, initials: state.currentUser.initials, role: 'Host', coinsEarned: 0, muted: false }
            ],
            pendingStageRequests: [],
            giftsLog: [],
            chat: [
              { author: 'VEIS Studio', badge: 'Live', text: `${state.currentUser.name} started a full-screen ${mode} broadcast: "${heading}".` }
            ]
          };

          state.liveStreams.unshift(newStream);
          const liveAlertCount = queueConnectionAlert('live', `${state.currentUser.name} is LIVE now`, heading, `#live-${newStream.id}`);
          state.liveFilter = 'Live';
          saveState();
          closeModal();
          enterFullScreenLiveRoom(newStream.id, false);
          renderApp();
          showToast(`You are now REAL LIVE in ${mode}!` + (liveAlertCount ? ` Connection alerts queued for ${liveAlertCount} connection(s).` : ''));
          return;
        }

        if (e.target.id === 'subscriptionVerifyForm') {
          e.preventDefault();
          if (!state.currentUser) return;
          showToast('Account verification and tier changes must be approved through the secure VEIS verification process. No tier or V-Coins have been changed.');
          return;
          const selected = document.querySelector('input[name="subTier"]:checked')?.value || 'free';
          const idFile = document.getElementById('kycIdFile')?.files?.[0];
          const selfieFile = document.getElementById('kycSelfieFile')?.files?.[0];
          const bizFile = document.getElementById('kycBizFile')?.files?.[0];

          if (selected === 'standard' && (!idFile || !selfieFile)) {
            showToast('Please attach both ID/Passport and Selfie for Standard verification.');
            return;
          }
          if (selected === 'business' && (!idFile || !selfieFile || !bizFile)) {
            showToast('Please attach ID, Selfie, and Business Registration (CIPC) for Business verification.');
            return;
          }

          const prevTier = state.currentUser.subscription || 'free';
          const prevCoins = getTierWelcomeVCoins(prevTier);
          const nextCoins = getTierWelcomeVCoins(selected);
          const coinDelta = Math.max(0, nextCoins - prevCoins);

          state.currentUser.subscription = selected;
          state.currentUser.verificationStatus =
            selected === 'business' ? 'Business Verified' : (selected === 'standard' ? 'Standard Verified' : 'Standard Member');

          if (coinDelta > 0) {
            state.vCoinPurchased = Number((Number(state.vCoinPurchased || 0) + coinDelta).toFixed(2));
            syncTotalVCoinBalance();
            recordLedgerEntry({
              type: 'tier-credit',
              category: 'Tier Allocation',
              label: `Plan Activation Credit (${selected.toUpperCase()} Account)`,
              amount: coinDelta,
              direction: 'in',
              withdrawable: false,
              status: 'Credited'
            });
            pushWelcomeAndVCoinNotifications(state.currentUser.name, selected, coinDelta);
          }

          // Account-tier activation and its V-Coin allocation must be confirmed
          // by a trusted server-side workflow; do not write wallet balances here.

          saveState();
          closeModal();
          renderApp();
          showToast(coinDelta > 0 ? `Plan updated! +${coinDelta} V-Coins credited to your E-Wallet.` : 'Plan updated!');
          return;
        }

        if (e.target.id === 'editProfileForm') {
          e.preventDefault();
          if (!state.currentUser) return;

          const avatarFile = document.getElementById('editAvatarFile')?.files?.[0];
          if (avatarFile) {
            state.currentUser.avatarUrl = await readFileAsDataUrl(avatarFile);
          }

          const coverFile = document.getElementById('editCoverFile')?.files?.[0];
          const coverUrlInput = document.getElementById('editCoverUrlInput')?.value.trim() || '';
          if (coverFile) {
            state.currentUser.coverUrl = await readFileAsDataUrl(coverFile);
          } else {
            state.currentUser.coverUrl = coverUrlInput;
          }

          state.currentUser.name = document.getElementById('editNameInput')?.value.trim() || state.currentUser.name;
          state.currentUser.initials = getInitials(state.currentUser.name);
          state.currentUser.role = document.getElementById('editRoleInput')?.value.trim() || state.currentUser.role;
          state.currentUser.venture = document.getElementById('editVentureInput')?.value.trim() || '';
          state.currentUser.location = document.getElementById('editLocationInput')?.value.trim() || 'South Africa';
          state.currentUser.birthday = document.getElementById('editBirthdayInput')?.value || '';
          state.currentUser.businessAnniversary = document.getElementById('editBizAnniversaryInput')?.value || '';
          state.currentUser.bio = document.getElementById('editBioInput')?.value.trim() || '';
          state.currentUser.socials = {
            facebook: document.getElementById('socFacebook')?.value.trim() || '',
            instagram: document.getElementById('socInstagram')?.value.trim() || '',
            linkedin: document.getElementById('socLinkedin')?.value.trim() || '',
            whatsapp: document.getElementById('socWhatsapp')?.value.trim() || '',
            tiktok: document.getElementById('socTiktok')?.value.trim() || '',
            website: document.getElementById('socWebsite')?.value.trim() || '',
            email: document.getElementById('socEmail')?.value.trim() || state.currentUser.email || '',
            youtube: document.getElementById('socYoutube')?.value.trim() || '',
            x: document.getElementById('socX')?.value.trim() || ''
          };
          syncCelebrationNotifications();

          if (supabaseClient) {
            supabaseClient.from('profiles').update({
              full_name: state.currentUser.name,
              role: state.currentUser.role,
              venture: state.currentUser.venture,
              location: state.currentUser.location,
              bio: state.currentUser.bio,
              socials: state.currentUser.socials
            }).eq('id', state.currentUser.id).then(() => {}).catch(() => {});
          }

          saveState();
          closeModal();
          renderApp();
          showToast('Profile and social media links updated!');
          return;
        }

        if (e.target.id === 'addCommentForm') {
          e.preventDefault();
          const postId = e.target.getAttribute('data-post-id');
          const text = document.getElementById('commentInput')?.value.trim();
          const post = state.posts.find(p => p.id === postId);
          const commentModeration = moderateVEISText(text);
          if (text && !commentModeration.allowed) {
            showModerationNotice(commentModeration);
            return;
          }
          if (post && text) {
            const author = state.currentUser ? state.currentUser.name : 'Entrepreneur';
            post.comments.push({ author, text });
            recordQualifiedPostView(post);
            saveState();
            showPostCommentsModal(post.id);
            renderApp();
          }
          return;
        }

        if (e.target.id === 'quickMessageForm') {
          e.preventDefault();
          const chatId = e.target.getAttribute('data-chat-id');
          const text = document.getElementById('quickMessageInput')?.value.trim() || '';
          const chat = state.messages.find(c => c.id === chatId);
          const att = state.pendingAttachment;
          if (chat && (text || att)) {
            const sender = state.currentUser ? state.currentUser.name : 'You';
            const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (att) {
              chat.thread.push({
                from: sender,
                msgType: 'file',
                fileName: att.name,
                fileSize: att.size,
                fileIsImage: att.isImage,
                fileDataUrl: att.dataUrl,
                text,
                time: nowTime
              });
              state.pendingAttachment = null;
            } else {
              chat.thread.push({
                from: sender,
                msgType: 'text',
                text,
                time: nowTime
              });
            }
            saveState();
            renderApp();
            const scrollEl = document.getElementById('chatMessagesScroll');
            if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
            showToast(att ? 'Attachment sent!' : 'Message sent!');
          }
          return;
        }

        if (e.target.id === 'bankDetailsForm') {
          e.preventDefault();
          state.bankDetails = {
            ...(state.bankDetails || {}),
            bankName: document.getElementById('bankNameInput')?.value.trim() || '',
            accountHolder: document.getElementById('bankHolderInput')?.value.trim() || '',
            accountNumber: document.getElementById('bankAccountInput')?.value.trim() || ''
          };
          saveState();
          renderApp();
          showToast('Creator banking details saved for withdrawals.');
          return;
        }

        if (e.target.id === 'adminVCoinConfigForm') {
          e.preventDefault();
          if (!isUserAdmin()) return;
          const nextRate = Math.max(1, Number(document.getElementById('cfgRateInput')?.value || 100));
          const nextThreshold = Math.max(10, Number(document.getElementById('cfgThresholdInput')?.value || 1000));
          const nextReward = Math.max(1, Number(document.getElementById('cfgRewardInput')?.value || 50));
          const nextMinWd = Math.max(100, Number(document.getElementById('cfgMinWdInput')?.value || 1000));

          state.vCoinConfig.exchangeRateCoinsPerZar = nextRate;
          state.vCoinConfig.viewsThreshold = nextThreshold;
          state.vCoinConfig.rewardCoinsPerThreshold = nextReward;
          state.vCoinConfig.minWithdrawalCoins = nextMinWd;
          recordAdminAudit(`Updated V-Coins Rules: ${nextRate} VC=R1, ${nextThreshold} views=${nextReward} VC, min withdrawal ${nextMinWd} VC`);
          saveState();
          renderApp();
          showToast('V-Coins economy configuration updated!');
          return;
        }

        if (e.target.id === 'withdrawVCoinForm') {
          e.preventDefault();
          showToast('V-Coin withdrawals are not active yet. Secure wallet and payout processing must be connected first. No withdrawal has been submitted.');
          return;
          const coins = Math.floor(Number(document.getElementById('withdrawVCoinInput')?.value || 0));
          const withdrawable = getWithdrawableVCoinBalance();
          const minWd = Number(state.vCoinConfig?.minWithdrawalCoins || 1000);
          const rate = Number(state.vCoinConfig?.exchangeRateCoinsPerZar || 100);
          const commRate = Number(state.vCoinConfig?.commissionRate ?? 0.10);

          if (coins < minWd) {
            showToast(`Minimum withdrawal is ${minWd.toLocaleString()} earned V-Coins.`);
            return;
          }
          if (coins > withdrawable) {
            showToast(`Only earned V-Coins (${withdrawable.toLocaleString()} VC) are withdrawable. Purchased coins are for in-app use.`);
            return;
          }
          const bank = state.bankDetails || {};
          if (!bank.bankName || !bank.accountNumber) {
            showToast('Please save your bank name and account number above before withdrawing.');
            return;
          }

          const grossZar = Number((coins / rate).toFixed(2));
          const commissionZar = Number((grossZar * commRate).toFixed(2));
          const netZar = Number((grossZar - commissionZar).toFixed(2));
          const refCode = 'WD-' + Math.floor(100000 + Math.random() * 900000);

          state.vCoinWithdrawn = Number((Number(state.vCoinWithdrawn || 0) + coins).toFixed(2));
          syncTotalVCoinBalance();

          const reqEntry = {
            id: 'wreq-' + Date.now(),
            ref: refCode,
            requester: state.currentUser?.name || 'Creator',
            coins,
            grossZar,
            commissionZar,
            netZar,
            bankSummary: `${bank.bankName} ••••${String(bank.accountNumber).slice(-4)}`,
            status: 'Pending Review',
            time: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          };
          state.withdrawalRequests.unshift(reqEntry);

          recordLedgerEntry({
            type: 'withdrawal',
            category: 'Creator Withdrawal',
            label: `Withdrawal ${refCode}: ${coins.toLocaleString()} VC (Gross R${grossZar.toFixed(2)} • 10% Fee R${commissionZar.toFixed(2)} • Net R${netZar.toFixed(2)})`,
            amount: coins,
            direction: 'out',
            withdrawable: true,
            status: 'Pending Review'
          });
          // Wallet writes are intentionally not performed from the browser.
          // V-Coin purchases, spending and withdrawals must use an authenticated server-side function.

          saveState();
          renderApp();
          showToast(`Withdrawal ${refCode} submitted! Gross R${grossZar.toFixed(2)} → Creator Net R${netZar.toFixed(2)} (90%).`);
          return;
        }
      });

      document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') closeModal();
      });

      document.addEventListener('change', async (e) => {
        if (e.target && e.target.id === 'messageBusinessThemeSelect') {
          const chosenThemeId = e.target.value;
          const foundTheme = MESSAGE_BUSINESS_THEMES.find(t => t.id === chosenThemeId);
          if (foundTheme) {
            state.messageTheme = foundTheme.id;
            saveState();
            renderApp();
            showToast(`Partnership theme set to ${foundTheme.name}`);
          }
        } else if (e.target && e.target.id === 'chatFileAttachmentInput') {
          const file = e.target.files?.[0];
          if (!file) return;
          const dataUrl = await readFileAsDataUrl(file);
          const kb = Math.max(1, Math.round(file.size / 1024));
          const sizeLabel = kb >= 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${kb} KB`;
          state.pendingAttachment = {
            name: file.name,
            size: sizeLabel,
            isImage: file.type.startsWith('image/'),
            dataUrl
          };
          renderApp();
          showToast(`Attached "${file.name}"`);
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'chatListSearchInput') {
          state.chatSearchQuery = e.target.value;
          const cursorPos = e.target.selectionStart || 0;
          renderApp();
          const reInput = document.getElementById('chatListSearchInput');
          if (reInput) {
            reInput.focus();
            reInput.setSelectionRange(cursorPos, cursorPos);
          }
        }
      });

      document.getElementById('globalSearchInput')?.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderApp();
      });

      function cycleLiveStream(dir = 1) {
        if (!state.activeBroadcast || state.activeBroadcast.type !== 'live') return;
        const list = state.liveStreams || [];
        if (list.length <= 1) {
          showToast('You are viewing the only active Live room right now.');
          return;
        }
        const idx = list.findIndex(s => s.id === state.activeBroadcast.id);
        const nextIdx = (idx + dir + list.length) % list.length;
        state.activeBroadcast.id = list[nextIdx].id;
        state.activeBroadcast.giftTrayOpen = false;
        renderFullScreenBroadcastOverlay();
        showToast(`Switched to: ${list[nextIdx].heading}`);
      }

      function cycleWebinarSlide(dir = 1) {
        if (!state.activeBroadcast || state.activeBroadcast.type !== 'webinar') return;
        const list = state.webinars || [];
        if (list.length <= 1) {
          showToast('Slide between webinars when multiple webinars are live.');
          return;
        }
        const idx = list.findIndex(w => w.id === state.activeBroadcast.id);
        const nextIdx = (idx + dir + list.length) % list.length;
        state.activeBroadcast.id = list[nextIdx].id;
        state.activeBroadcast.giftTrayOpen = false;
        renderFullScreenBroadcastOverlay();
        showToast(`Webinar ${nextIdx + 1}/${list.length}: ${list[nextIdx].topic}`);
      }

      let __gestureStartX = 0;
      let __gestureStartY = 0;
      let __wheelCooldown = 0;

      document.addEventListener('touchstart', (e) => {
        if (!state.activeBroadcast || !e.touches || !e.touches[0]) return;
        __gestureStartX = e.touches[0].clientX;
        __gestureStartY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (!state.activeBroadcast || !e.changedTouches || !e.changedTouches[0]) return;
        if (e.target.closest('#broadcastChatFeed') || e.target.closest('input') || e.target.closest('button')) return;
        const dx = e.changedTouches[0].clientX - __gestureStartX;
        const dy = e.changedTouches[0].clientY - __gestureStartY;
        if (state.activeBroadcast.type === 'live' && Math.abs(dy) > 65 && Math.abs(dy) > Math.abs(dx)) {
          cycleLiveStream(dy < 0 ? 1 : -1);
        } else if (state.activeBroadcast.type === 'webinar' && Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)) {
          cycleWebinarSlide(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      document.addEventListener('wheel', (e) => {
        if (!state.activeBroadcast || state.activeBroadcast.type !== 'live') return;
        if (e.target.closest('#broadcastChatFeed')) return;
        const now = Date.now();
        if (now - __wheelCooldown < 650) return;
        if (Math.abs(e.deltaY) > 35) {
          __wheelCooldown = now;
          cycleLiveStream(e.deltaY > 0 ? 1 : -1);
        }
      }, { passive: true });

      function bootVEISApp() {
        try {
          runDailyBotWisdomScheduler();
          const deepLink = String(location.hash || '');
          if (deepLink.startsWith('#live-')) { const id = deepLink.slice(6); setTimeout(() => enterFullScreenLiveRoom(id, false), 250); }
          else if (deepLink.startsWith('#webinar-')) { const id = deepLink.slice(8); setTimeout(() => enterFullScreenWebinarTheatre(id), 250); }
          else if (deepLink.startsWith('#post-')) { state.routeParam = deepLink.slice(6); }
          syncCelebrationNotifications();
          renderApp();
          syncWithSupabase();
        } catch (err) {
          console.error('VEIS boot error:', err);
          const container = document.getElementById('appViewContainer');
          if (container) {
            container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-rose-200 text-sm text-rose-700">Initializing VEIS workspace... Please refresh if needed.</div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootVEISApp);
      } else {
        bootVEISApp();
      }
      window.addEventListener('load', () => {
        const container = document.getElementById('appViewContainer');
        if (container && !container.innerHTML.trim()) {
          bootVEISApp();
        }
      });
    })();
  </script>
</body>
</html>
