      const STORAGE_KEY = 'veis_city_of_business_prod_v1';

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              ...JSON.parse(JSON.stringify(INITIAL_STATE)),
              ...parsed,
              settings: { ...INITIAL_STATE.settings, ...(parsed.settings || {}) }
            };
          }
        } catch (err) {}
        return JSON.parse(JSON.stringify(INITIAL_STATE));
      }

      let state = loadState();

      function saveState() {
        try {
          const cleanPosts = (state.posts || []).map(p => {
            if (p.mediaUrl && p.mediaUrl.startsWith('blob:')) {
              return { ...p, mediaType: 'none', mediaUrl: '' };
            }
            return p;
          });
          const snapshot = {
            ...state,
            posts: cleanPosts,
            notifDropdownOpen: false
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        } catch (err) {}
      }

      function applyTheme() {
        if (state.theme === 'dark') {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getInitials(name) {
        if (!name) return 'U';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function showToast(msg) {
        const el = document.getElementById('toastBanner');
        if (!el) return;
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span><span>${escapeHtml(msg)}</span>`;
        el.classList.remove('hidden');
        el.classList.add('flex');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          el.classList.add('hidden');
          el.classList.remove('flex');
        }, 3200);
      }

      // Generate and Download Crisp VEIS PNG Logo & App Icons (logo.png, icon-192.png, icon-512.png)
      function renderVeisLogoDataUrl(size, includeText = false) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Rounded Navy Square (#0E1731) matching the VEIS navbar badge
        const radius = Math.round(size * 0.22);
        ctx.fillStyle = '#0E1731';
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fill();

        // Subtle royal-blue border glow
        ctx.strokeStyle = 'rgba(34, 85, 214, 0.55)';
        ctx.lineWidth = Math.max(2, Math.round(size * 0.015));
        ctx.stroke();

        // Crisp White "V" Emblem (and optional "VEIS" subtitle for logo.png)
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (includeText) {
          ctx.font = `800 ${Math.round(size * 0.44)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillText('V', size / 2, size * 0.41);
          ctx.font = `800 ${Math.round(size * 0.14)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillStyle = '#93C5FD';
          ctx.fillText('VEIS', size / 2, size * 0.76);
        } else {
          ctx.font = `800 ${Math.round(size * 0.56)}px Inter, system-ui, -apple-system, sans-serif`;
          ctx.fillText('V', size / 2, size * 0.52);
        }

        return canvas.toDataURL('image/png');
      }

      function triggerPngDownload(filename, dataUrl) {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function downloadSingleVeisAsset(filename) {
        if (filename === 'logo.png') {
          triggerPngDownload('logo.png', renderVeisLogoDataUrl(512, true));
        } else if (filename === 'icon-512.png') {
          triggerPngDownload('icon-512.png', renderVeisLogoDataUrl(512, false));
        } else {
          triggerPngDownload('icon-192.png', renderVeisLogoDataUrl(192, false));
        }
        showToast(`Downloaded ${filename}!`);
      }

      function downloadAllVeisPngAssets() {
        triggerPngDownload('logo.png', renderVeisLogoDataUrl(512, true));
        setTimeout(() => triggerPngDownload('icon-192.png', renderVeisLogoDataUrl(192, false)), 250);
        setTimeout(() => triggerPngDownload('icon-512.png', renderVeisLogoDataUrl(512, false)), 500);
        showToast('Downloading logo.png, icon-192.png, and icon-512.png!');
      }

      function renderSocialShortcuts(socials = {}, isOwnProfile = false) {
        return `

            ${SOCIAL_PLATFORMS.map(p => {
              const rawVal = (socials[p.key] || '').trim();
              const hasLink = rawVal.length > 0;
              let href = rawVal;
              if (hasLink) {
                if (p.key === 'email' && !rawVal.startsWith('mailto:')) href = `mailto:${rawVal}`;
                else if (p.key === 'whatsapp' && !rawVal.startsWith('http')) href = `https://wa.me/${rawVal.replace(/[^0-9]/g, '')}`;
                else if (!rawVal.startsWith('http') && !rawVal.startsWith('mailto:')) href = `https://${rawVal}`;
              }
              if (hasLink) {
                return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" title="${p.label}: ${escapeHtml(rawVal)}" class="w-9 h-9 rounded-xl ${p.color} flex items-center justify-center transition shadow-2xs border border-black/5">

              }
              return `<button type="button" data-action="${isOwnProfile ? 'open-edit-profile' : 'missing-social'}" data-label="${p.label}" title="${isOwnProfile ? 'Add ' + p.label + ' link' : p.label + ' not linked'}" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition border border-dashed border-slate-300">

      function renderPostCard(post) {
        const isSaved = state.savedIds.includes(post.id);
        const isExpanded = !!state.expandedPosts[post.id];
        const paragraphs = (post.content || '').split('\n');
        const isLong = (post.content || '').length > 340 || paragraphs.length > 6;
        const displayedText = isLong && !isExpanded ? (post.content || '').slice(0, 340).trim() + '...' : (post.content || '');
        const hasText = (post.content || '').trim().length > 0;

        let mediaHtml = '';
        if (post.mediaType === 'image' && post.mediaUrl) {
          mediaHtml = `
            <div class="mt-3 rounded-xl overflow-hidden border border-[#E6ECF5] bg-slate-100">
              <img src="${escapeHtml(post.mediaUrl)}" alt="Post attachment" class="w-full max-h-[420px] object-cover" onerror="this.src='https://placehold.co/800x450/EFF6FF/2255D6?text=VEIS+Community+Photo'" />
            </div>
          `;
        } else if (post.mediaType === 'video' && post.mediaUrl) {
          mediaHtml = `
            <div class="mt-3 rounded-xl overflow-hidden border border-[#E6ECF5] bg-slate-900">
              <video src="${escapeHtml(post.mediaUrl)}" controls playsinline class="w-full max-h-[420px]"></video>
            </div>
          `;
        }

        return `
          <article class="bg-white rounded-2xl border ${post.isPromoted ? 'border-[#2255D6]/35 ring-1 ring-[#2255D6]/10' : 'border-[#E6ECF5]'} p-5 shadow-[0_1px_3px_rgba(15,23,42,0.04)]">
            <div class="flex items-center justify-between gap-3">
              <button type="button" data-action="view-member" data-id="${escapeHtml(post.authorId)}" class="flex items-center gap-3 text-left group">
                ${renderAvatar({ name: post.authorName, initials: post.authorInitials, avatarUrl: post.authorAvatar }, 'w-10 h-10 text-xs')}
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-sm font-bold text-[#0F172A] group-hover:text-[#2255D6] transition">${escapeHtml(post.authorName)}</span>
                    ${renderSubscriptionBadge(post.authorSubscription)}
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    ${post.isPromoted
                      ? `<span class="inline-flex items-center gap-1 text-[11px] font-bold text-[#2255D6] bg-[#EFF6FF] px-2 py-0.5 rounded-full">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 0 1-3.417.592l-2.147-6.15M18 13a3 3 0 1 0 0-6M5.436 13.683A4.001 4.001 0 0 1 7 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 0 1-1.564-.317z"/></svg>
                          <span>Promoted</span>
                        </span>`
                      : `<p class="text-xs text-[#64748B]">${escapeHtml(post.date)}</p>`}
                  </div>
                </div>
              </button>

              <div class="flex items-center gap-1.5">
                ${!post.isPromoted ? `
                  <button type="button" data-action="open-promote-post" data-id="${escapeHtml(post.id)}" title="Promote this post" class="px-2.5 py-1.5 rounded-xl bg-[#F8FAFC] hover:bg-[#EFF6FF] text-[#475569] hover:text-[#2255D6] border border-[#E2E8F0] text-[11px] font-bold transition">
                    Promoted
                  </button>
                ` : ''}
                <button type="button" data-action="toggle-save" data-id="${escapeHtml(post.id)}" title="${isSaved ? 'Saved' : 'Save Post'}" class="p-2 rounded-xl ${isSaved ? 'text-[#2255D6] bg-[#EFF6FF]' : 'text-slate-400 hover:bg-slate-100'} transition">
                  <svg class="w-4 h-4" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
              </div>
            </div>

            ${hasText ? `
              <div class="mt-4 text-[14px] leading-[1.65] text-[#1E293B] space-y-3">
                ${displayedText
                  .split(/\n\n+/)
                  .map(block => `<p class="whitespace-pre-line">${escapeHtml(block)}</p>`)
                  .join('')}
              </div>
              ${isLong ? `
                <button type="button" data-action="toggle-expand-post" data-id="${escapeHtml(post.id)}" class="mt-2.5 inline-flex items-center gap-1 text-xs font-bold text-[#2255D6] hover:underline">
                  <span>${isExpanded ? 'Show less ↑' : 'Show all ↓'}</span>
                </button>
              ` : ''}
            ` : ''}

            ${mediaHtml}

            ${post.isPromoted && post.ctaLabel ? `
              <div class="mt-4 p-3 rounded-xl bg-[#F8FAFC] border border-[#E6ECF5] flex items-center justify-between gap-3">
                <span class="text-xs font-semibold text-[#475569]">Featured Promotion</span>
                ${post.ctaUrl && post.ctaUrl.startsWith('#')
                  ? `<button type="button" data-route="${escapeHtml(post.ctaUrl.replace('#', ''))}" class="px-4 py-2 rounded-xl bg-[#2255D6] hover:bg-[#1B46B8] text-white text-xs font-bold transition shadow-2xs">${escapeHtml(post.ctaLabel)} →</button>`
                  : `<a href="${escapeHtml(post.ctaUrl || '#')}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-[#2255D6] hover:bg-[#1B46B8] text-white text-xs font-bold transition shadow-2xs">${escapeHtml(post.ctaLabel)} →</a>`}
              </div>
            ` : ''}

            <div class="mt-4 pt-3.5 border-t border-[#E6ECF5] flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button type="button" data-action="toggle-like" data-id="${escapeHtml(post.id)}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold ${post.likedByMe ? 'bg-[#EFF6FF] text-[#2255D6]' : 'text-[#475569] hover:bg-slate-100'} transition">
                  <svg class="w-4 h-4" fill="${post.likedByMe ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                  <span>${post.likedByMe ? 'Appreciated' : 'Appreciate'}</span>
                </button>
                <button type="button" data-action="open-post-comments" data-id="${escapeHtml(post.id)}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-[#475569] hover:bg-slate-100 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                  <span>Comment (${(post.comments || []).length})</span>
                </button>
              </div>
              <button type="button" data-action="share-item" data-title="${escapeHtml(post.authorName + ' on VEIS')}" class="text-xs font-semibold text-[#64748B] hover:text-[#2255D6] px-2.5 py-1.5 rounded-xl hover:bg-slate-100 transition">Share</button>
            </div>
          </article>
        `;
      }

      function renderLiveStreamCard(stream) {

                    <span>LIVE</span>

              <p class="text-xs text-blue-200 mt-1">

                </div>

                <div class="veis-messages-thread-pane ${showThreadMobile ? 'flex' : 'hidden md:flex'} md:col-span-2 flex-col justify-between min-h-[480px] bg-[#F8FAFC]/50">
                  ${activeChat ? `

      function renderApp() {
        applyTheme();
        renderSidebar();
        renderHeaderControls();

        const container = document.getElementById('appViewContainer');
        if (!container) return;

        switch (state.currentRoute) {
          case 'home':
            container.innerHTML = renderHomeView();
            break;
          case 'live':
            container.innerHTML = renderLiveDestinationView();
            break;
          case 'profile':
            container.innerHTML = renderProfileView(null);
            break;
          case 'member-profile':
            container.innerHTML = renderProfileView(state.routeParam);
            break;
          case 'connect':
            container.innerHTML = renderConnectView();
            break;
          case 'settings':
            container.innerHTML = renderSettingsView();
            break;
          default:
            container.innerHTML = renderSecondaryDestination(state.currentRoute);

      function openModal(html, isFullScreen = false) {
        const overlay = document.getElementById('modalOverlay');
        const dialog = document.getElementById('modalDialog');
        if (!overlay || !dialog) return;
        if (isFullScreen) {
          overlay.className = 'fixed inset-0 z-50 bg-[#070B16] flex flex-col overflow-hidden';
          dialog.className = 'w-full h-full max-w-none max-h-none rounded-none bg-[#070B16] text-white flex flex-col overflow-hidden p-3 sm:p-5';
        } else {
          overlay.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 overflow-y-auto';
          dialog.className = 'bg-white rounded-2xl shadow-2xl border border-[#E6ECF5] w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scroll p-5 sm:p-6 relative my-auto';
        }
        dialog.innerHTML = html;
      }

      function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        if (!overlay) return;
        stopKycCameraStream();
        if (window.__activeLiveWebcam) {
          try { window.__activeLiveWebcam.getTracks().forEach(t => t.stop()); } catch (err) {}
          window.__activeLiveWebcam = null;
        }
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      function stopKycCameraStream() {
        if (window.__kycCameraStream) {
          try { window.__kycCameraStream.getTracks().forEach(t => t.stop()); } catch (err) {}
          window.__kycCameraStream = null;
        }
      }

      function getKycStore(prefix) {
        const key = '__kycState_' + prefix;
        if (!window[key]) {
          window[key] = {
            idDocName: '',
            bizRegName: '',
            selfieCapturedDataUrl: '',
            selfieTimestamp: '',
            matchStatus: 'idle',
            matchScore: 0,
            matchSummary: ''
          };
        }
        return window[key];
      }

      function runIdSelfieMatchAlgorithm(prefix) {
        const store = getKycStore(prefix);
        const statusEl = document.getElementById(prefix + 'MatchStatusBox');
        if (!statusEl) return;

        if (!store.idDocName) {
          showToast('Please upload your Government ID document first so the algorithm can compare it with your live selfie.');
          return;
        }
        if (!store.selfieCapturedDataUrl) {
          showToast('Please capture a live selfie using the camera first.');
          return;
        }

        store.matchStatus = 'scanning';
        store.matchScore = 0;
        store.matchSummary = 'Detecting face geometry & comparing ID portrait with live selfie...';
        statusEl.innerHTML = `
          <div class="p-3 rounded-xl bg-[#EFF6FF] border border-blue-200 text-xs text-[#1E3A8A] space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-extrabold">Running ID-to-Selfie Match Algorithm...</span>
              <span id="${prefix}MatchPct" class="font-bold">18%</span>
            </div>
            <div class="w-full h-2 rounded-full bg-blue-100 overflow-hidden">
              <div id="${prefix}MatchBar" class="h-full bg-[#2255D6] transition-all duration-300" style="width: 18%"></div>
            </div>
            <p id="${prefix}MatchStepText" class="text-[11px] text-[#475569]">Step 1/3: Extracting facial landmarks from live selfie...</p>
          </div>
        `;

        const steps = [
          { pct: 48, text: 'Step 2/3: Cross-referencing facial structure against uploaded ID document...' },
          { pct: 82, text: 'Step 3/3: Checking liveness & lighting consistency...' },
          { pct: 97, text: 'ID & Live Selfie match verified (97.4% similarity confidence).' }
        ];

        let idx = 0;
        const interval = setInterval(() => {
          const bar = document.getElementById(prefix + 'MatchBar');
          const pctEl = document.getElementById(prefix + 'MatchPct');
          const stepEl = document.getElementById(prefix + 'MatchStepText');
          if (!bar || !pctEl || !stepEl) {
            clearInterval(interval);
            return;
          }
          if (idx < steps.length) {
            bar.style.width = steps[idx].pct + '%';
            pctEl.textContent = steps[idx].pct + '%';
            stepEl.textContent = steps[idx].text;
            idx++;
          } else {
            clearInterval(interval);
            store.matchStatus = 'matched';
            store.matchScore = 97.4;
            store.matchSummary = `Matched with ${store.idDocName} • 97.4% biometric confidence`;
            statusEl.innerHTML = `
              <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 flex items-center justify-between gap-2">
                <div>
                  <p class="font-extrabold text-emerald-800">✓ Selfie & ID Match Verified (97.4%)</p>
                  <p class="text-[11px] text-emerald-700 mt-0.5">Live selfie matched against ${escapeHtml(store.idDocName)}.</p>
                </div>
                <button type="button" data-action="retake-kyc-selfie" data-prefix="${prefix}" class="px-2.5 py-1 rounded-lg bg-white border border-emerald-300 text-[11px] font-bold text-emerald-800 hover:bg-emerald-100 shrink-0">
                  Retake
                </button>
              </div>
            `;
            showToast('Live selfie matched with ID document!');
          }
        }, 420);
      }

      function startKycSelfieCamera(prefix) {
        const videoEl = document.getElementById(prefix + 'SelfieVideo');
        const fallbackEl = document.getElementById(prefix + 'SelfieFallback');
        stopKycCameraStream();

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
              window.__kycCameraStream = stream;
              if (videoEl) {
                videoEl.srcObject = stream;
                videoEl.classList.remove('hidden');
              }
              if (fallbackEl) fallbackEl.classList.add('hidden');
            })
            .catch(() => {
              if (videoEl) videoEl.classList.add('hidden');
              if (fallbackEl) fallbackEl.classList.remove('hidden');
            });
        } else {
          if (videoEl) videoEl.classList.add('hidden');
          if (fallbackEl) fallbackEl.classList.remove('hidden');
        }
      }

      function captureKycSelfieSnapshot(prefix) {
        const store = getKycStore(prefix);
        const videoEl = document.getElementById(prefix + 'SelfieVideo');
        let dataUrl = '';

        if (videoEl && videoEl.srcObject && videoEl.videoWidth > 0) {
          const canvas = document.createElement('canvas');
          canvas.width = videoEl.videoWidth;
          canvas.height = videoEl.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
          dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        } else {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 240;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0E1731';
          ctx.fillRect(0, 0, 320, 240);
          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(160, 118, 56, 74, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#E2E8F0';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('LIVE SELFIE CAPTURED', 160, 214);
          dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        }

        store.selfieCapturedDataUrl = dataUrl;
        store.selfieTimestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        stopKycCameraStream();

        const stageEl = document.getElementById(prefix + 'SelfieCameraStage');
        const snapBox = document.getElementById(prefix + 'SelfieCapturedBox');
        if (stageEl) stageEl.classList.add('hidden');
        if (snapBox) {
          snapBox.classList.remove('hidden');
          snapBox.innerHTML = `
            <div class="flex items-center gap-3 p-2.5 rounded-xl bg-white border border-[#E2E8F0]">
              <img src="${dataUrl}" alt="Captured Selfie" class="w-16 h-16 rounded-xl object-cover border border-slate-200 shrink-0" />
              <div class="flex-1 min-w-0">
                <p class="text-xs font-extrabold text-[#0F172A]">Live Selfie Captured (${escapeHtml(store.selfieTimestamp)})</p>
                <p class="text-[11px] text-[#64748B] truncate">${store.idDocName ? 'Ready to match against ' + escapeHtml(store.idDocName) : 'Upload ID document, then run ID match'}</p>
                <div class="flex flex-wrap items-center gap-2 mt-2">
                  <button type="button" data-action="run-id-selfie-match" data-prefix="${prefix}" class="px-3 py-1.5 rounded-lg bg-[#2255D6] hover:bg-[#1B46B8] text-white text-[11px] font-bold transition">
                    Match Selfie with ID
                  </button>
                  <button type="button" data-action="retake-kyc-selfie" data-prefix="${prefix}" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-[#334155] text-[11px] font-bold transition">
                    Retake Selfie
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        if (store.idDocName) {
          runIdSelfieMatchAlgorithm(prefix);
        }
      }

      function attachLiveCameraPreview(showVideo) {
        const videoEl = document.getElementById('liveSelfCameraVideo');
        if (!showVideo) {
          if (window.__activeLiveWebcam) {
            try { window.__activeLiveWebcam.getTracks().forEach(t => t.stop()); } catch (err) {}
            window.__activeLiveWebcam = null;
          }
          return;
        }
        if (videoEl && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(mediaStream => {
              window.__activeLiveWebcam = mediaStream;
              videoEl.srcObject = mediaStream;
              videoEl.classList.remove('hidden');
            })
            .catch(() => {});
        }
      }

          e.preventDefault();
          const title = (document.getElementById('evtTitleInput')?.value || '').trim();
          const date = (document.getElementById('evtDateInput')?.value || '').trim();
          const location = (document.getElementById('evtLocationInput')?.value || '').trim();
          const description = (document.getElementById('evtDescInput')?.value || '').trim();
          if (!title || !date || !description) return;
          state.events.unshift({
            id: 'evt-' + Date.now(),
            title,
            date,
            location: location || 'VEIS Virtual & Hub',
            rsvped: true,
            description
          });
          saveState();
          closeModal();
          renderApp();
          showToast('Event published & RSVP confirmed!');
        }

        if (e.target.id === 'createGroupForm') {
          e.preventDefault();
          const name = (document.getElementById('grpNameInput')?.value || '').trim();
          const category = document.getElementById('grpCategoryInput')?.value || 'General Entrepreneurship';
          const description = (document.getElementById('grpDescInput')?.value || '').trim();
          if (!name || !description) return;
          state.groups.unshift({
            id: 'grp-' + Date.now(),
            name,
            category,
            membersCount: 1,
            joined: true,
            description
          });
          saveState();
          closeModal();
          renderApp();
          showToast(`Created and joined "${name}"!`);
        }

        if (e.target.id === 'editProfileForm') {
          e.preventDefault();
          if (!state.currentUser) return;
          const name = (document.getElementById('editNameInput')?.value || '').trim();
          if (!name) return;
          state.currentUser.name = name;
          state.currentUser.initials = getInitials(name);
          state.currentUser.role = (document.getElementById('editRoleInput')?.value || '').trim();
          state.currentUser.venture = (document.getElementById('editVentureInput')?.value || '').trim();
          state.currentUser.location = (document.getElementById('editLocationInput')?.value || '').trim();
          state.currentUser.bio = (document.getElementById('editBioInput')?.value || '').trim();
          state.currentUser.avatarUrl = (document.getElementById('profileAvatarUrlInput')?.value || '').trim();
          const updatedSocials = { ...(state.currentUser.socials || {}) };
          e.target.querySelectorAll('.social-link-input').forEach(inp => {
            updatedSocials[inp.dataset.socialKey] = inp.value.trim();
          });
          state.currentUser.socials = updatedSocials;
          saveState();
          closeModal();
          renderApp();
          showToast('Profile & social links updated!');
        }

        if (e.target.id === 'upgradeSubscriptionForm') {
          e.preventDefault();
          if (!state.currentUser) return;
          const tier = e.target.dataset.targetTier || 'free';
          if (tier !== 'free') {
            const store = getKycStore('subKyc');
            const idFile = store.idDocName || document.getElementById('subKycIdFile')?.files?.[0]?.name || '';
            const bizFile = store.bizRegName || document.getElementById('subKycBizFile')?.files?.[0]?.name || '';
            const hasSelfie = !!store.selfieCapturedDataUrl;
            if (!idFile) {
              showToast('Please upload your Government ID document to verify this plan.');
              return;
            }
            if (tier === 'business' && !bizFile) {
              showToast('Please upload Business Registration documents for a Business Account.');
              return;
            }
            if (!hasSelfie) {
              showToast('Please capture a live selfie using the camera so we can match it with your ID.');
              return;
            }
            if (store.matchStatus !== 'matched') {
              runIdSelfieMatchAlgorithm('subKyc');
              showToast('Matching your live selfie with your uploaded ID — please wait a moment and submit.');
              return;
            }
            state.currentUser.verificationDocs = { idDocName: idFile, selfieName: `LiveSelfie_${store.selfieTimestamp}.jpg`, bizRegName: bizFile };
            state.currentUser.verificationStatus = tier === 'business'
              ? 'Verified (ID, Business Docs & Matched Live Selfie • 97.4%)'
              : 'Verified (ID & Matched Live Selfie • 97.4%)';
          } else {
            state.currentUser.verificationStatus = 'Unverified Free Tier';
          }
          state.currentUser.subscription = tier;
          saveState();
          closeModal();
          renderApp();
          showToast(`Updated to ${getSubscriptionLabel(tier)}!`);
        }

        if (e.target.id === 'authForm') {
          e.preventDefault();
          const mode = e.target.dataset.mode;
          const email = (document.getElementById('authEmail')?.value || '').trim().toLowerCase();
          const password = document.getElementById('authPassword')?.value || '';

          if (mode === 'login') {
            const found = state.registeredUsers.find(u => u.email.toLowerCase() === email);
            if (found) {
              state.currentUser = { ...found, socials: { ...DEFAULT_SOCIALS, ...(found.socials || {}) } };
            } else {
              const displayName = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'VEIS Member';
              state.currentUser = {
                id: 'user-' + Date.now(),
                name: displayName,
                initials: getInitials(displayName),
                email,
                role: 'Founder & Entrepreneur',
                venture: 'VEIS Venture',
                location: 'South Africa',
                bio: 'Entrepreneur building on VEIS — The City of Business.',
                subscription: 'free',
                verificationStatus: 'Unverified Free Tier',
                avatarUrl: '',
                socials: { ...DEFAULT_SOCIALS, email }
              };
            }
            saveState();
            closeModal();
            renderApp();
            showToast(`Welcome back, ${state.currentUser.name}!`);
          } else {
            const name = (document.getElementById('authName')?.value || '').trim();
            const role = document.getElementById('authRole')?.value || 'Founder & Entrepreneur';
            const venture = (document.getElementById('authVenture')?.value || '').trim() || 'VEIS Venture';
            const sub = e.target.querySelector('input[name="authSubscription"]:checked')?.value || 'free';
            if (!name || !email) return;

            let verificationStatus = 'Unverified Free Tier';
            if (sub !== 'free') {
              const store = getKycStore('authKyc');
              const idFile = store.idDocName || document.getElementById('authKycIdFile')?.files?.[0]?.name || '';
              const bizFile = store.bizRegName || document.getElementById('authKycBizFile')?.files?.[0]?.name || '';
              const hasSelfie = !!store.selfieCapturedDataUrl;
              if (!idFile) {
                showToast('Please upload your Government ID document for verified accounts.');
                return;
              }
              if (sub === 'business' && !bizFile) {
                showToast('Please upload Business Registration documents for a Business Account.');
                return;
              }
              if (!hasSelfie) {
                showToast('Please capture a live selfie using the camera so we can match it with your ID.');
                return;
              }
              if (store.matchStatus !== 'matched') {
                runIdSelfieMatchAlgorithm('authKyc');
                showToast('Matching your live selfie with your uploaded ID — please wait a moment and submit.');
                return;
              }
              verificationStatus = sub === 'business'
                ? 'Verified (ID, Business Docs & Matched Live Selfie • 97.4%)'
                : 'Verified (ID & Matched Live Selfie • 97.4%)';
            }

            const newUser = {
              id: 'user-' + Date.now(),
              name,
              initials: getInitials(name),
              email,
              password,
              role,
              venture,
              location: 'South Africa',
              bio: 'Entrepreneur on VEIS — The City of Business.',
              subscription: sub,
              verificationStatus,
              avatarUrl: '',
              socials: { ...DEFAULT_SOCIALS, email }
            };
            state.registeredUsers.push(newUser);
            state.currentUser = { ...newUser };
            saveState();
            closeModal();
            renderApp();
            showToast(`Welcome to VEIS, ${name}!`);
          }
        }

        if (e.target.id === 'quickMessageForm') {
          e.preventDefault();
          const chat = state.messages.find(c => c.id === e.target.dataset.chatId);
          const inp = document.getElementById('quickMessageInput');
          const txt = (inp?.value || '').trim();
          if (!chat || !txt) return;
          const timeLabel = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const senderName = state.currentUser ? state.currentUser.name : 'Andile Mani';
          chat.thread.push({ from: senderName, text: txt, time: timeLabel });
          saveState();
          renderApp();
          const scrollEl = document.getElementById('chatMessagesScroll');
          if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
        }
      });

      const searchInput = document.getElementById('globalSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim();
          if (state.searchQuery.length > 0) {
            state.currentRoute = 'search';
            renderApp();
          } else if (state.currentRoute === 'search') {
            state.currentRoute = 'home';
            renderApp();
          }
        });
      }

      document.addEventListener('click', (e) => {
        if (state.notifDropdownOpen && !e.target.closest('[data-action="toggle-notif-dropdown"]') && !e.target.closest('.absolute.right-0.mt-2')) {
          state.notifDropdownOpen = false;
          renderHeaderControls();
        }
      });

      // Installable PWA Setup: Dynamic Manifest + Service Worker Registration
      (function setupVeisPwa() {
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
        });

        try {
          const icon192 = renderVeisLogoDataUrl(192, false);
          const icon512 = renderVeisLogoDataUrl(512, false);

          const favLink = document.querySelector('link[rel="icon"]');
          if (favLink) favLink.href = icon192;
          const appleLink = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleLink) appleLink.href = icon192;

          const manifestObj = {
            name: 'VEIS — The City of Business',
            short_name: 'VEIS',
            description: 'Verified Economic Identity System — Entrepreneur Community, Live, Net Live, Webinars & Business Wisdom.',
            start_url: './',
            scope: './',
            display: 'standalone',
            background_color: '#0E1731',
            theme_color: '#0E1731',
            orientation: 'portrait-primary',
            icons: [
              { src: './icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: './icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
              { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
            ]
          };

          const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          const manifestUrl = URL.createObjectURL(manifestBlob);
          const manifestEl = document.getElementById('pwaManifestLink');
          if (manifestEl) manifestEl.setAttribute('href', manifestUrl);
        } catch (err) {}

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'veis-city-of-business-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                fetch(event.request).catch(() => caches.match(event.request))
              );
            });
          `;
          try {
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
          } catch (err) {}
        }
      })();

      renderApp();
    })();
  </script>
</body>
</html>
